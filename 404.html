<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminux | 404 Sayfa Bulunamadı</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body, html { background-color: #000000; color: #ffffff; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .bg-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            background-color: #050505;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .error-container {
            position: relative; z-index: 2;
            background: #080808; border: 1px solid #1a1a1a; border-radius: 12px;
            padding: 60px 80px; text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            max-width: 600px; width: 90%;
        }

        .error-code { font-size: 120px; font-weight: 900; line-height: 1; color: #ff3333; margin-bottom: 10px; letter-spacing: -5px; }
        .error-title { font-size: 24px; font-weight: 800; margin-bottom: 20px; letter-spacing: -1px; color: #fff; }
        .error-desc { color: #888; font-size: 14px; line-height: 1.6; margin-bottom: 40px; }

        .btn-home {
            display: inline-block; background: #fff; color: #000; text-decoration: none;
            padding: 18px 35px; font-size: 14px; font-weight: 800; border-radius: 6px;
            transition: 0.2s; letter-spacing: 1px; border: none; cursor: pointer;
        }
        .btn-home:hover { background: #00ff00; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,255,0,0.2); }

        .brand-logo { position: absolute; top: 40px; left: 50px; z-index: 2; font-size: 24px; font-weight: 900; color: #fff; letter-spacing: -1px; }
        .brand-logo span { color: #444; font-size: 12px; font-weight: 600; letter-spacing: 1px; margin-left: 5px; }

        @media (max-width: 768px) {
            .error-container { padding: 40px 25px; }
            .error-code { font-size: 80px; }
            .error-title { font-size: 20px; }
            .brand-logo { top: 25px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <div class="brand-logo">TERMINUX <span>SYSTEM</span></div>

    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-title">SİSTEM BAĞLANTISI BULUNAMADI</div>
        <div class="error-desc">
            Erişmeye çalıştığınız terminal adresi geçersiz veya sistemden kaldırılmış olabilir. Lütfen geçerli bir yönlendirme kullandığınızdan emin olun.
        </div>
        <a href="index.html" class="btn-home">WMS ANA EKRANA DÖN</a>
    </div>
</body>
</html>
