<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Terminux | Lens Admin Paneli</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 40px; }
        .box { max-width: 900px; margin: 0 auto; border: 1px solid #111; background: #050505; padding: 40px; border-radius: 8px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .upload-section { border: 1px solid #222; padding: 25px; background: #0a0a0a; border-radius: 4px; }
        input { background: #000; border: 1px solid #222; color: #fff; padding: 15px; width: 100%; box-sizing: border-box; }
        label { font-size: 11px; color: #666; text-transform: uppercase; display: block; margin-bottom: 12px; letter-spacing: 1px; font-weight: bold; }
        button { background: #fff; color: #000; border: none; padding: 15px; font-weight: 800; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 15px; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-alcon { background: #00ccff; color: #000; }
        .btn-tecnis { background: #ffbc00; color: #000; }
        .log { margin-top: 30px; font-family: monospace; font-size: 12px; color: #00ff00; border-top: 1px solid #111; padding-top: 20px; height: 250px; overflow-y: auto; }
        h1 { margin-bottom: 40px; font-size: 24px; letter-spacing: -1px; }
        .brand-title { color: #fff; font-size: 16px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>TERMINUX LENS KONTROL</h1>
        
        <div class="row">
            <div class="upload-section">
                <div class="brand-title" style="color: #00ccff;">ALCON LENS YÜKLEME</div>
                <label>Sütunlar: Ürün Kodu, Ürün İsmi, Lens No, Stok Miktar</label>
                <input type="file" id="f-alcon" accept=".xlsx">
                <button id="btn-alcon" class="btn-alcon">ALCON EXCEL YÜKLE</button>
            </div>
            
            <div class="upload-section">
                <div class="brand-title" style="color: #ffbc00;">TECNIS LENS YÜKLEME</div>
                <label>Sütunlar: Ürün Kodu, Ürün İsmi, Lens No, Stok Miktar</label>
                <input type="file" id="f-tecnis" accept=".xlsx">
                <button id="btn-tecnis" class="btn-tecnis">TECNIS EXCEL YÜKLE</button>
            </div>
        </div>

        <div id="log" class="log">Sistem komut bekliyor...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCX-X3ri95oQtO53tgEyAwqHuu1mmYKONM",
            authDomain: "terminux-wms.firebaseapp.com",
            projectId: "terminux-wms",
            storageBucket: "terminux-wms.firebasestorage.app",
            messagingSenderId: "427323493367",
            appId: "1:427323493367:web:8c0f7bdd21fe5b83c3bcf2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const logger = (m) => {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${m}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        };

        const getCol = (row, keys) => {
            const rowKeys = Object.keys(row);
            for (let k of rowKeys) {
                if (keys.includes(k.trim().toLowerCase())) {
                    return (row[k] !== null && row[k] !== undefined) ? row[k].toString().trim() : "";
                }
            }
            return "";
        };

        async function processLensExcel(inputId, brand) {
            const file = document.getElementById(inputId).files[0];
            if(!file) return logger("Lütfen Excel dosyası seçin.");

            const collectionName = brand === "ALCON" ? "lens_alcon" : "lens_tecnis";
            const reader = new FileReader();

            reader.onload = async (e) => {
                const workbook = XLSX.read(e.target.result, { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                logger(`(${brand}) ${rows.length} satır işleniyor...`);

                let updateCount = 0;
                
                for (let r of rows) {
                    const id = getCol(r, ["ürün kodu", "urun kodu", "kod"]);
                    if(!id) continue;

                    const urunAdiStr = getCol(r, ["ürün ismi", "ürün adı", "urun adi", "isim"]);
                    const lensNoStr = getCol(r, ["lens no", "lens numarası", "numara", "no"]);
                    const miktarVal = parseInt(getCol(r, ["stok miktar", "stok", "miktar", "adet"])) || 0;

                    const newData = {
                        urunKodu: id,
                        urunAdi: urunAdiStr,
                        lensNo: lensNoStr,
                        miktar: miktarVal,
                        marka: brand
                    };

                    await setDoc(doc(db, collectionName, id), newData, { merge: true });
                    updateCount++;
                }
                
                logger(`✅ (${brand}) İŞLEM BİTTİ! Yüklenen Kayıt: <b>${updateCount}</b>`);
                document.getElementById(inputId).value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        document.getElementById('btn-alcon').addEventListener('click', () => processLensExcel('f-alcon', 'ALCON'));
        document.getElementById('btn-tecnis').addEventListener('click', () => processLensExcel('f-tecnis', 'TECNIS'));
    </script>
</body>
</html>
