<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminux | Depo Yönetimi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body, html { background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { padding: 20px 40px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; background: #050505; flex-shrink: 0; z-index: 100; }
        .header-title { font-weight: 900; font-size: 24px; letter-spacing: -1px; color: #fff; display: flex; align-items: center; gap: 10px; }
        .header-subtitle { color: #ff3333; font-size: 14px; font-weight: 800; letter-spacing: 2px; }
        .btn-header { background: #111; color: #fff; border: 1px solid #333; padding: 10px 15px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; display: inline-block; white-space: nowrap; }
        .btn-header:hover { background: #222; border-color: #555; }
        
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #000; position: relative; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #080808; border-bottom: 1px solid #1a1a1a; gap: 15px; flex-wrap: wrap; }
        .search-wrapper { position: relative; flex: 1; max-width: 500px; }
        .search-input { width: 100%; background: #0a0a0a; border: 2px solid #333; color: #fff; padding: 12px 15px; font-size: 14px; border-radius: 6px; outline: none; transition: 0.2s; font-family: monospace; }
        .search-input:focus { border-color: #ff3333; }
        .autocomplete-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #0a0a0a; border: 1px solid #333; z-index: 1000; max-height: 300px; overflow-y: auto; border-radius: 6px; margin-top: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .autocomplete-item { padding: 12px 15px; border-bottom: 1px solid #1a1a1a; cursor: pointer; transition: 0.2s; }
        .autocomplete-item:hover { background: #111; border-left: 3px solid #ff3333; }
        .ac-name { color: #fff; font-size: 12px; font-weight: 800; }
        .ac-code { color: #888; font-size: 10px; font-family: monospace; margin-top: 4px; }
        
        .action-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .btn-action { background: #111; color: #fff; border: 1px solid #333; padding: 10px 15px; font-size: 11px; font-weight: 800; border-radius: 6px; cursor: pointer; transition: 0.2s; letter-spacing: 1px; }
        .btn-action:hover { border-color: #fff; }
        .btn-action-qr { background: #00ccff; color: #000; border-color: #00ccff; }
        .btn-action-qr:hover { opacity: 0.8; }
        .btn-action-excel { background: #00ff00; color: #000; border-color: #00ff00; display: none; }
        .btn-action-excel:hover { opacity: 0.8; }
        .btn-danger { background: rgba(255,51,51,0.1); color: #ff3333; border: 1px solid rgba(255,51,51,0.3); }
        
        .btn-danger-flash { animation: flashBtn 0.8s infinite alternate; }
        @keyframes flashBtn {
            from { background: rgba(255,51,51,0.2); color: #ff3333; border-color: #ff3333; }
            to { background: #ff0000; color: #ffffff; border-color: #ff0000; text-shadow: 0px 1px 3px #000; }
        }

        .map-container { flex: 1; position: relative; background: #050505; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 20px; }
        .map-wrapper { width: 100%; max-width: 1400px; aspect-ratio: 16/7; position: relative; background: #020202; border: 2px solid #1a1a1a; border-radius: 12px; }
        
        .map-door { position: absolute; right: 0; left: auto; top: 40%; width: 40px; height: 20%; border-left: 4px dashed #ffbc00; border-top: 4px dashed #ffbc00; border-bottom: 4px dashed #ffbc00; border-right: none; background: rgba(255,188,0,0.05); display: flex; align-items: center; justify-content: center; border-radius: 8px 0 0 8px; z-index: 10; }
        .map-door span { color: #ffbc00; font-weight: 900; font-size: 10px; transform: rotate(90deg); letter-spacing: 2px; }

        .aisle-container { position: absolute; left: 5%; top: 10%; width: 80%; height: 75%; display: grid; grid-template-columns: repeat(8, 1fr); gap: 3%; z-index: 5; }
        .aisle { background: #0a0a0a; border: 2px solid #222; border-radius: 6px; display: grid; grid-template-rows: repeat(5, 1fr); gap: 2px; padding: 4px; position: relative; }
        
        .shelf { background: #111; border: 1px solid #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
        .shelf:hover { border-color: #ffbc00; transform: scale(1.05); z-index: 20; box-shadow: 0 0 20px rgba(255,188,0,0.4); }
        .shelf-address { color: #fff; font-family: monospace; font-size: 12px; font-weight: 900; background: rgba(0,0,0,0.85); padding: 4px 6px; border-radius: 4px; pointer-events: none; z-index: 2; border: 1px solid #444; }

        .alert-30 { animation: flash30 0.8s infinite alternate; border-color: #fff !important; }
        .alert-60 { animation: flash60 1s infinite alternate; border-color: #fff !important; }
        .alert-90 { animation: flash90 1.2s infinite alternate; border-color: #fff !important; }
        .alert-120 { background: #ffd700 !important; }
        .alert-180 { background: rgba(255, 255, 0, 0.2) !important; border-color: #ffff00 !important; }
        .alert-360 { border-color: #00ff00 !important; }

        .alert-30 .shelf-address, .alert-60 .shelf-address, .alert-90 .shelf-address { text-shadow: 1px 1px 3px #000; color: #fff; }

        @keyframes flash30 { from { background: rgba(255,0,0,0.2); box-shadow: 0 0 5px #ff0000; } to { background: rgba(255,0,0,1); box-shadow: 0 0 20px #ff0000; } }
        @keyframes flash60 { from { background: rgba(255,69,0,0.1); box-shadow: 0 0 5px #ff4500; } to { background: rgba(255,69,0,0.8); box-shadow: 0 0 15px #ff4500; } }
        @keyframes flash90 { from { background: rgba(255,140,0,0.1); box-shadow: 0 0 5px #ff8c00; } to { background: rgba(255,140,0,0.6); box-shadow: 0 0 10px #ff8c00; } }

        #svg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
        .path-line { stroke: #ff0000; stroke-width: 4; fill: none; stroke-dasharray: 10; animation: dash 0.5s linear infinite reverse; filter: drop-shadow(0 0 5px #ff0000); }
        @keyframes dash { to { stroke-dashoffset: 20; } }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px); padding: 20px; }
        .modal-box { background: #0c0c0c; border: 1px solid #333; border-radius: 12px; padding: 30px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.9); margin: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 20px; gap: 15px; }
        .modal-title { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 1px; display: flex; align-items: center; gap: 15px; }
        .btn-close { background: transparent; border: none; color: #888; font-size: 24px; cursor: pointer; line-height: 1; }
        .btn-close:hover { color: #ff3333; }

        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 10px; color: #666; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .form-group input, .form-group select { background: #000; border: 1px solid #333; color: #00ff00; padding: 12px; font-family: monospace; font-size: 14px; border-radius: 6px; outline: none; transition: 0.2s; width: 100%; }
        .form-group input:focus, .form-group select:focus { border-color: #ffbc00; }
        .btn-save { background: #00ff00; color: #000; border: none; padding: 12px 20px; font-weight: 900; font-size: 12px; border-radius: 6px; cursor: pointer; letter-spacing: 1px; transition: 0.2s; text-transform: uppercase; width: 100%; }
        .btn-save:hover { opacity: 0.8; }

        .stock-item { background: #111; border: 1px solid #222; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .stock-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .stock-name { font-size: 13px; font-weight: 800; color: #fff; }
        .stock-code { font-size: 11px; color: #00ccff; font-family: monospace; }
        .lot-row { display: flex; justify-content: space-between; align-items: center; background: #050505; padding: 8px 12px; border-radius: 4px; margin-bottom: 5px; border: 1px solid #1a1a1a; }
        .lot-miat { font-size: 12px; font-weight: bold; font-family: monospace; }
        .lot-qty { font-size: 14px; font-weight: 900; color: #00ff00; }
        .btn-remove { background: rgba(255,51,51,0.1); border: 1px solid rgba(255,51,51,0.3); color: #ff3333; padding: 6px 10px; font-size: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; display: none; }
        .btn-remove:hover { background: #ff3333; color: #000; }

        .legend-bar { display: flex; gap: 15px; padding: 10px 40px; background: #020202; border-top: 1px solid #1a1a1a; flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 10px; color: #888; font-weight: bold; letter-spacing: 1px; }
        .legend-color { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #444; }

        .report-table { width: 100%; border-collapse: collapse; }
        .report-table th, .report-table td { padding: 12px; text-align: left; border-bottom: 1px solid #1a1a1a; font-size: 12px; }
        .report-table th { color: #666; font-size: 10px; font-weight: bold; letter-spacing: 1px; }
        
        .qr-display { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: #fff; border-radius: 12px; margin-top: 20px; }
        
        #password-modal .modal-box { max-width: 350px; text-align: center; margin: auto; }
        #password-modal input { text-align: center; font-size: 24px; letter-spacing: 8px; }

        #scanner-modal .modal-box { text-align: center; padding: 20px; }
        #reader { width: 100%; max-width: 400px; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #333; margin: 0 auto; }

        @media (max-width: 900px) {
            header { flex-direction: column; padding: 15px; gap: 15px; text-align: center; }
            .header-title { flex-direction: column; gap: 5px; font-size: 20px; }
            .toolbar { flex-direction: column; align-items: stretch; padding: 15px; }
            .search-wrapper { max-width: 100%; }
            .action-group { flex-wrap: wrap; justify-content: space-between; }
            .action-group button { flex: 1; min-width: 45%; }
            .map-container { padding: 10px; overflow-x: auto; justify-content: flex-start; }
            .map-wrapper { min-width: 100%; }
            .shelf-address { font-size: 8px; padding: 2px 4px; }
            .legend-bar { padding: 15px; padding-bottom: 30px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">TERMINUX <span class="header-subtitle">DEPO YÖNETİMİ</span></div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
            <button id="btn-admin" class="btn-header" onclick="openAdminLogin()">YÖNETİCİ GİRİŞİ</button>
            <a href="index.html" class="btn-header">WMS GEÇİŞ</a>
        </div>
    </header>

    <div class="toolbar">
        <div class="search-wrapper">
            <input type="text" id="search-input" class="search-input" placeholder="İçerideki ürünlerde ara..." autocomplete="off">
            <div id="search-dropdown" class="autocomplete-dropdown"></div>
        </div>
        <div class="action-group">
            <input type="file" id="excel-upload" accept=".xlsx, .xls" style="display:none;" onchange="processExcelUpload(event)">
            <button id="btn-excel-upload" class="btn-action btn-action-excel" onclick="document.getElementById('excel-upload').click()">EXCEL TOPLU YÜKLE</button>
            <button class="btn-action btn-action-qr" onclick="openScanner()">QR TARA</button>
            <button id="btn-critical-report" class="btn-action btn-danger" onclick="openReportModal()">KRİTİK MİAT RAPORU</button>
            <button class="btn-action" onclick="openMasterQR()">GENEL QR KOD</button>
        </div>
    </div>

    <div class="map-container">
        <div class="map-wrapper" id="room-map">
            <div class="map-door" id="room-door"><span>KAPI</span></div>
            <div class="aisle-container" id="aisle-container"></div>
            <svg id="svg-overlay">
                <defs>
                    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                        <polygon points="0 0, 6 3, 0 6" fill="#ff0000" />
                    </marker>
                </defs>
            </svg>
        </div>
    </div>

    <div class="legend-bar">
        <div class="legend-item"><div class="legend-color" style="background:#ff0000; animation:flash30 1s infinite alternate;"></div> < 30 GÜN</div>
        <div class="legend-item"><div class="legend-color" style="background:#ff4500; animation:flash60 1s infinite alternate;"></div> < 60 GÜN</div>
        <div class="legend-item"><div class="legend-color" style="background:#ff8c00; animation:flash90 1s infinite alternate;"></div> < 90 GÜN</div>
        <div class="legend-item"><div class="legend-color" style="background:#ffd700;"></div> < 120 GÜN</div>
        <div class="legend-item"><div class="legend-color" style="background:rgba(255,255,0,0.2); border-color:#ffff00;"></div> < 180 GÜN</div>
        <div class="legend-item"><div class="legend-color" style="background:transparent; border-color:#00ff00;"></div> +360 GÜN</div>
    </div>

    <div id="password-modal" class="modal">
        <div class="modal-box">
            <h3 style="color:#fff; margin-bottom:20px; font-size:16px; letter-spacing:1px; margin-top:0;">YÖNETİCİ ŞİFRESİ</h3>
            <input type="password" id="admin-pw" autocomplete="new-password">
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn-save" style="background:#333; color:#fff;" onclick="closeModal('password-modal')">İPTAL</button>
                <button class="btn-save" onclick="verifyAdmin()">GİRİŞ YAP</button>
            </div>
        </div>
    </div>

    <div id="custom-alert" class="modal" style="z-index:30000;">
        <div class="modal-box" style="max-width:400px; text-align:center;">
            <div class="modal-title" id="alert-title" style="color:#ffbc00;">UYARI</div>
            <div id="alert-desc" style="font-size:14px; color:#aaa; margin-bottom:30px;">-</div>
            <button class="btn-save" style="background:#fff; color:#000;" onclick="closeModal('custom-alert')">TAMAM</button>
        </div>
    </div>

    <div id="shelf-modal" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="shelf-modal-title">RAF BİLGİSİ</div>
                <div style="display:flex; gap:10px; align-items:center;">
                    <button id="btn-toggle-edit" class="btn-action" style="display:none; background:#ffbc00; color:#000; border:none;" onclick="toggleShelfEdit()">DÜZENLE</button>
                    <button class="btn-close" onclick="closeModal('shelf-modal')">×</button>
                </div>
            </div>
            
            <div id="admin-shelf-controls" style="display:none; margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid #222;">
                <div class="form-group">
                    <label>RAF ADRESİ TANIMLA</label>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="edit-shelf-address" placeholder="Örn: 12.01.01">
                        <button class="btn-save" style="width:auto;" onclick="saveShelfAddress()">KAYDET</button>
                    </div>
                </div>
                <button class="btn-action" style="width:100%; border-color:#00ff00; color:#00ff00; padding:15px; font-size:12px;" onclick="openAddStockModal()">+ BU RAFA YENİ ÜRÜN EKLE</button>
            </div>

            <div id="shelf-content-list"></div>
        </div>
    </div>

    <div id="add-stock-modal" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title">STOK EKLE</div>
                <button class="btn-close" onclick="closeModal('add-stock-modal')">×</button>
            </div>
            <div class="form-group" style="position:relative;">
                <label>ÜRÜN ARA (KATALOGDAN)</label>
                <input type="text" id="add-search" placeholder="Ürün adı veya kodu...">
                <div id="add-autocomplete" class="autocomplete-dropdown" style="position:absolute; max-height:150px; z-index:10001;"></div>
            </div>
            <input type="hidden" id="add-selected-code">
            <input type="hidden" id="add-selected-name">
            <div class="form-group">
                <label>MİAT TARİHİ</label>
                <input type="date" id="add-miat">
            </div>
            <div class="form-group">
                <label>MİKTAR</label>
                <input type="number" id="add-qty" min="1" value="1">
            </div>
            <button class="btn-save" style="margin-top:10px;" onclick="executeAddStock()">STOĞA EKLE</button>
        </div>
    </div>

    <div id="decrease-stock-modal" class="modal" style="z-index:25000;">
        <div class="modal-box" style="max-width:350px;">
            <div class="modal-header">
                <div class="modal-title" style="color:#ff3333;">STOK EKSİLT</div>
                <button class="btn-close" onclick="closeModal('decrease-stock-modal')">×</button>
            </div>
            <div style="font-size:12px; color:#aaa; margin-bottom:15px;" id="decrease-info"></div>
            <div class="form-group">
                <label>ÇIKARILACAK MİKTAR</label>
                <input type="number" id="decrease-qty" min="1" value="1" style="text-align:center; font-size:24px;">
            </div>
            <input type="hidden" id="decrease-code">
            <input type="hidden" id="decrease-name">
            <input type="hidden" id="decrease-miat">
            <button class="btn-save" style="background:#ff3333; color:#fff;" onclick="executeDecreaseStock()">ÇIKART</button>
        </div>
    </div>

    <div id="report-modal" class="modal">
        <div class="modal-box" style="max-width: 900px;">
            <div class="modal-header">
                <div class="modal-title" style="color:#ff3333;">KRİTİK MİAT RAPORU (< 180 GÜN)</div>
                <button class="btn-close" onclick="closeModal('report-modal')">×</button>
            </div>
            <table class="report-table">
                <thead><tr><th>ÜRÜN KODU</th><th>ÜRÜN İSMİ</th><th>ADRES</th><th>MİAT</th><th>KALAN GÜN</th><th>MİKTAR</th></tr></thead>
                <tbody id="report-table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="qr-modal" class="modal">
        <div class="modal-box" style="text-align:center; max-width:400px;">
            <div class="modal-header">
                <div class="modal-title" id="qr-modal-title">QR KOD</div>
                <button class="btn-close" onclick="closeModal('qr-modal')">×</button>
            </div>
            <div class="qr-display">
                <canvas id="qr-canvas"></canvas>
                <div id="qr-label" style="margin-top:15px; font-weight:900; color:#000; font-size:18px; letter-spacing:2px;"></div>
            </div>
        </div>
    </div>

    <div id="scanner-modal" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" style="color:#00ccff;">QR OKUT</div>
                <button class="btn-close" onclick="closeScanner()">×</button>
            </div>
            <div id="reader"></div>
            <button class="btn-save" style="background:#ff3333; color:#fff; margin-top:20px;" onclick="closeScanner()">İPTAL / KAPAT</button>
        </div>
    </div>

    <div id="qr-content-modal" class="modal">
        <div class="modal-box" style="max-width:800px;">
            <div class="modal-header">
                <div class="modal-title" id="qr-content-title" style="color:#00ccff;">DEPO İÇERİĞİ</div>
                <button class="btn-close" onclick="closeModal('qr-content-modal')">×</button>
            </div>
            <table class="report-table">
                <thead><tr><th>ÜRÜN KODU</th><th>ÜRÜN İSMİ</th><th>ADRES</th><th>MİAT</th><th>MİKTAR</th></tr></thead>
                <tbody id="qr-content-body"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCX-X3ri95oQtO53tgEyAwqHuu1mmYKONM",
            authDomain: "terminux-wms.firebaseapp.com",
            projectId: "terminux-wms",
            storageBucket: "terminux-wms.firebasestorage.app",
            messagingSenderId: "427323493367",
            appId: "1:427323493367:web:8c0f7bdd21fe5b83c3bcf2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isAdmin = false;
        let isEditMode = false;
        let catalog = {};
        let addresses = {};
        let roomStock = {};
        let activeShelfId = null;
        let html5QrCode = null;

        window.showCustomAlert = (title, desc) => {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-desc').innerText = desc;
            document.getElementById('custom-alert').style.display = 'flex';
        };

        const logOperation = async (type, code, name, qty, miat, shelfId) => {
            try {
                const now = new Date();
                const logId = 'LOG-' + now.getTime();
                await setDoc(doc(collection(db, "kilitli_depo_logs"), logId), {
                    tip: type,
                    urunKodu: code,
                    urunAdi: name,
                    miktar: qty,
                    miat: miat,
                    raf: addresses[shelfId] || shelfId,
                    tarih: now.toISOString(),
                    kullanici: 'Admin'
                });
            } catch (e) { console.error("Log error", e); }
        };

        const initMap = () => {
            const container = document.getElementById('aisle-container');

            for(let i=1; i<=8; i++) {
                for(let j=1; j<=5; j++) {
                    const sId = `shelf-${i}-${j}`;
                    const el = document.getElementById(`addr-${sId}`);
                    if(el) {

        const getDaysDiff = (dateStr) => {
            if(!dateStr) return 9999;
            let parts = dateStr.split('-');
            if(parts.length !== 3) {
                parts = dateStr.split('.');
                if(parts.length !== 3) return 9999;
                dateStr = `${parts[2]}-${parts[1]}-${parts[0]}`; 
            }
            const d = new Date(dateStr);
            const now = new Date();
            return Math.ceil((d - now) / (1000 * 60 * 60 * 24));
        };

        const updateMapColors = () => {
            document.querySelectorAll('.shelf').forEach(el => {
                el.className = 'shelf'; 
            });

            const shelfWorstMiat = {};

            for(let key in roomStock) {
                const item = roomStock[key];
                const sId = item.shelfId;
                if(!sId) continue;

                let worstDays = 9999;
                for(let miat in item.lots) {
                    const days = getDaysDiff(miat);
                    if(days < worstDays) worstDays = days;
                }

                if(!shelfWorstMiat[sId] || worstDays < shelfWorstMiat[sId]) {
                    shelfWorstMiat[sId] = worstDays;
                }
            }

            for(let sId in shelfWorstMiat) {
                const el = document.getElementById(sId);
                if(el) {
                    const d = shelfWorstMiat[sId];
                    if(d <= 30) el.classList.add('alert-30');
                    else if(d <= 60) el.classList.add('alert-60');
                    else if(d <= 90) el.classList.add('alert-90');
                    else if(d <= 120) el.classList.add('alert-120');
                    else if(d <= 180) el.classList.add('alert-180');
                    else if(d <= 360) el.classList.add('alert-360');
                }
            }
        };

                }
            }
            const btn = document.getElementById('btn-critical-report');
            if(criticalCount > 0) {
                btn.classList.add('btn-danger-flash');
                btn.innerText = `KRİTİK MİAT RAPORU (${criticalCount})`;
            } else {

            let html = '';
            items.forEach(item => {

                    const da = a.includes('.') ? `${a.split('.')[2]}-${a.split('.')[1]}-${a.split('.')[0]}` : a;

        window.openDecreaseModal = (code, name, miat, currentQty) => {

            document.getElementById('decrease-qty').value = "1";
            document.getElementById('decrease-qty').max = currentQty;
            document.getElementById('decrease-info').innerHTML = `<b style="color:#fff;">${name}</b><br>KOD: ${code} | MİAT: <span style="color:#ffbc00;">${miat}</span> | MEVCUT: <span style="color:#00ff00;">${currentQty}</span>`;
            document.getElementById('decrease-stock-modal').style.display = 'flex';
        };

        window.executeDecreaseStock = async () => {
            if(!isAdmin || !activeShelfId) return;
            const code = document.getElementById('decrease-code').value;
            const name = document.getElementById('decrease-name').value;
            const miat = document.getElementById('decrease-miat').value;
            const qtyToRemove = parseInt(document.getElementById('decrease-qty').value);
            
            if(isNaN(qtyToRemove) || qtyToRemove <= 0) return showCustomAlert("HATA", "Geçerli bir miktar girin.");

            const docId = `${activeShelfId}_${code}`;
            const existing = roomStock[docId];
            if(!existing) return;

            let lots = existing.lots;
            if(!lots[miat]) return;

            if (qtyToRemove > lots[miat]) {
                return showCustomAlert("HATA", "Mevcut stoktan fazla miktar çıkarılamaz.");
            }

            lots[miat] -= qtyToRemove;
            if(lots[miat] <= 0) delete lots[miat];

            if(Object.keys(lots).length === 0) {
                await deleteDoc(doc(db, "kilitli_depo_stok", docId));
            } else {
                await setDoc(doc(db, "kilitli_depo_stok", docId), { ...existing, lots: lots });
            }
            
            await logOperation("ÇIKARMA", code, name, qtyToRemove, miat, activeShelfId);
            
            closeModal('decrease-stock-modal');
            renderShelfContents(activeShelfId);
        };

        window.processExcelUpload = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            
            if(!isAdmin) {
                document.getElementById('excel-upload').value = '';
                return showCustomAlert("YETKİSİZ İŞLEM", "Toplu yükleme yapmak için yönetici girişi yapmalısınız.");
            }

            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = new Uint8Array(ev.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    
                    const addrToShelf = {};
                    for(let sId in addresses) {
                        addrToShelf[addresses[sId]] = sId;
                    }

                    let addedCount = 0;
                    for(let r of rows) {
                        const rawCode = r['Ürün Kodu'] || r['urun kodu'] || r['Kod'] || r['kod'];
                        const rawName = r['Ürün Adı'] || r['urun adi'] || r['İsim'];
                        const rawMiat = r['Miat'] || r['miat'];
                        const rawAddr = r['Adres'] || r['adres'];
                        const rawQty = r['Miktar'] || r['miktar'] || 1;
                        
                        if(rawCode && rawMiat && rawAddr) {
                            const code = String(rawCode).trim();
                            const addr = String(rawAddr).trim();
                            let miat = String(rawMiat).trim();
                            
                            const numCheck = parseFloat(miat);
                            if(!isNaN(numCheck) && miat.indexOf('.') === -1 && miat.indexOf('-') === -1) {
                                const d = new Date(Math.round((numCheck - 25569)*86400*1000));
                                miat = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
                            } else if (miat.includes('-')) {
                                const p = miat.split('-');
                                if(p[0].length === 4) miat = `${p[2]}.${p[1]}.${p[0]}`; 
                            }

                            const qty = parseInt(rawQty) || 1;
                            const shelfId = addrToShelf[addr];
                            
                            if(shelfId) {
                                const docId = `${shelfId}_${code}`;
                                let existing = roomStock[docId] || { shelfId: shelfId, urunKodu: code, urunAdi: rawName || "", adres: addr, lots: {} };
                                existing.lots[miat] = (existing.lots[miat] || 0) + qty;
                                
                                await setDoc(doc(db, "kilitli_depo_stok", docId), existing);
                                addedCount++;
                                await logOperation("EXCEL YÜKLEME", code, rawName || "", qty, miat, shelfId);
                            }
                        }
                    }
                    showCustomAlert("BAŞARILI", `${addedCount} adet ürün veya lot başarıyla sisteme aktarıldı.`);
                } catch(error) {
                    showCustomAlert("HATA", "Excel dosyası okunurken hata oluştu. Sütun isimlerini (Ürün Kodu, Ürün Adı, Miat, Adres, Miktar) kontrol edin.");
                }
                document.getElementById('excel-upload').value = '';
            };
            reader.readAsArrayBuffer(file);
        };

        const clearSvgPath = () => { document.getElementById('svg-overlay').innerHTML = `<defs><marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#ff0000"/></marker></defs>`; };

        const drawArrow = (shelfId) => {
            clearSvgPath();
            const mapW = document.getElementById('room-map').getBoundingClientRect();
            const door = document.getElementById('room-door').getBoundingClientRect();
            const shelf = document.getElementById(shelfId);
            if(!shelf) return;
            
            const aisle = shelf.parentElement;
            const aisleR = aisle.getBoundingClientRect();
            
            const startX = (door.left - mapW.left) - 10;
            const startY = (door.top + door.height/2 - mapW.top);
            
            const targetX = (aisleR.left + aisleR.width/2 - mapW.left);
            const targetY = (aisleR.bottom - mapW.top) + 25; 
            
            const bottomCorridorY = mapW.height - 15;

            const svg = document.getElementById('svg-overlay');
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            
            const d = `M ${startX} ${startY} L ${startX} ${bottomCorridorY} L ${targetX} ${bottomCorridorY} L ${targetX} ${targetY}`;
            path.setAttribute('d', d);
            path.setAttribute('class', 'path-line');
            path.setAttribute('marker-end', 'url(#arrowhead)');
            svg.appendChild(path);

            shelf.style.animation = 'flash30 0.3s 6 alternate';
            setTimeout(() => { shelf.style.animation = ''; updateMapColors(); }, 1800);
        };

            });
        };

        window.closeScanner = () => {
            document.getElementById('scanner-modal').style.display = 'none';
            if(html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
            }
        };

        const handleQRScanResult = (text) => {
            let processedText = text;
            if(text.includes('?qr=')) {
                const urlObj = new URL(text);
                processedText = `terminux_qr_${urlObj.searchParams.get('qr')}`;
            }

            if(processedText.startsWith("terminux_qr_aisle_")) {
                let num = processedText.replace("terminux_qr_aisle_", "");
                showQRContent("REYON " + num, "aisle-" + num);
            } else if(processedText === "terminux_qr_master") {
                showQRContent("TÜM DEPO ENVANTERİ", "all");
            } else {
                showCustomAlert("TANIMSIZ KOD", "Okutulan QR kod depo reyonlarıyla eşleşmiyor.");
            }
        };

        const showQRContent = (title, target) => {
            document.getElementById('qr-content-title').innerText = title;
            const tbody = document.getElementById('qr-content-body');
            let rows = [];

            for(let key in roomStock) {
                const item = roomStock[key];
                const itemAisle = item.shelfId ? item.shelfId.split('-')[1] : null;
                
                if(target === "all" || (target.startsWith("aisle-") && itemAisle === target.split('-')[1])) {
                    for(let miat in item.lots) {
                        rows.push({
                            code: item.urunKodu,
                            name: item.urunAdi,
                            addr: item.adres,
                            miat: miat,
                            qty: item.lots[miat]
                        });
                    }
                }
            }

            if(rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px; color:#ff3333; font-weight:bold;">Bu alanda kayıtlı ürün bulunmuyor.</td></tr>`;
            } else {
                rows.sort((a,b) => a.addr.localeCompare(b.addr));
                tbody.innerHTML = rows.map(r => {
                    return `
                        <tr>
                            <td style="font-family:monospace;">${r.code}</td>
                            <td style="font-weight:bold;">${r.name}</td>
                            <td style="font-family:monospace; color:#00ccff;">${r.addr || '-'}</td>
                            <td style="font-family:monospace; color:#ffbc00;">${r.miat}</td>
                            <td style="font-weight:bold; color:#00ff00;">${r.qty}</td>
                        </tr>
                    `;
                }).join('');
            }

            document.getElementById('qr-content-modal').style.display = 'flex';
        };

        document.getElementById('admin-pw').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') verifyAdmin();
        });

        initMap();
        loadData();

    </script>
</body>
</html>
