<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminux | WMS Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #000000; color: #ffffff; height: 100vh; display: flex; overflow: hidden; }
        .hidden { display: none !important; }

        #loading-screen { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; font-size: 24px; font-weight: 800; letter-spacing: 5px; color: #333; position: absolute; z-index: 9999; }

        .split-layout { display: flex; width: 100%; height: 100%; }
        .brand-section { flex: 1; background-color: #050505; background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; display: flex; flex-direction: column; justify-content: center; padding: 10%; border-right: 1px solid #1a1a1a; }
        .brand-title { font-size: 4.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; color: #ffffff; }
        .brand-subtitle { font-size: 1rem; font-weight: 500; color: #888888; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 2rem; }
        .brand-website { font-size: 0.875rem; font-weight: 500; color: #444444; letter-spacing: 0.1em; text-decoration: none; transition: color 0.2s; }
        .brand-website:hover { color: #ffffff; }

        .form-section { width: 500px; background-color: #000000; display: flex; flex-direction: column; justify-content: center; padding: 80px; }
        .login-header { margin-bottom: 40px; }
        .login-header h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
        .login-header p { color: #666666; font-size: 0.875rem; }
        .input-group { margin-bottom: 24px; position: relative; }
        .input-group input { width: 100%; background: #0a0a0a; border: 1px solid #222222; color: #ffffff; padding: 16px; font-size: 14px; border-radius: 4px; transition: 0.2s; outline: none; }
        .input-group input:focus { border-color: #ffffff; background: #000000; }
        .input-group label { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #666666; font-size: 14px; pointer-events: none; transition: 0.2s; }
        .input-group input:focus ~ label, .input-group input:valid ~ label { top: 0; font-size: 11px; background: #000000; padding: 0 4px; color: #ffffff; }
        .btn-submit { width: 100%; background: #ffffff; color: #000000; border: none; padding: 16px; font-size: 14px; font-weight: 600; border-radius: 4px; cursor: pointer; margin-top: 8px; transition: 0.2s; }
        .btn-submit:hover { opacity: 0.9; }
        
        .btn-lens-redirect { display: block; width: 100%; text-align: center; background: #0a0a0a; color: #888; border: 1px solid #222; padding: 16px; font-size: 14px; font-weight: 600; border-radius: 4px; cursor: pointer; margin-top: 16px; text-decoration: none; transition: 0.2s; }
        .btn-lens-redirect:hover { border-color: #444; color: #ffffff; }

        .btn-scan-mobile { display: none; background: #000; border: 2px solid #222; color: #00ff00; padding: 0 35px; font-size: 24px; font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn-scan-mobile:hover { border-color: #00ff00; background: rgba(0, 255, 0, 0.1); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        @media (max-width: 900px) {
            body { padding: 10px !important; padding-bottom: 120px !important; }
            
            #app-screen > header { 
                display: flex !important;
                flex-direction: column !important; 
                align-items: center !important; 
                padding: 20px 15px !important; 
                gap: 15px !important; 
            }
            #app-screen > header > div:nth-child(1) { 
                text-align: center !important; 
            }
            #app-screen > header > div:nth-child(2) { 
                display: flex !important;
                flex-direction: row !important; 
                flex-wrap: wrap !important; 
                justify-content: center !important; 
                width: 100% !important; 
                gap: 10px !important; 
            }
            #app-screen > header > div:nth-child(2) > a { 
                order: 1 !important; 
                flex: 1 !important; 
                text-align: center !important; 
                font-size: 11px !important; 
                padding: 12px 10px !important; 
                white-space: nowrap !important; 
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #btn-logout { 
                order: 2 !important; 
                flex: 1 !important; 
                font-size: 11px !important; 
                padding: 12px 10px !important; 
                white-space: nowrap !important; 
            }
            #app-screen > header > div:nth-child(2) > span { 
                order: 3 !important; 
                width: 100% !important; 
                text-align: center !important; 
                margin-top: 5px !important; 
                font-size: 12px !important; 
            }

            #login-screen:not(.hidden) { display: flex !important; flex-direction: column !important; justify-content: center !important; align-items: center !important; background: #050505 !important; padding: 20px !important; min-height: 100vh !important; width: 100vw !important; overflow: hidden !important; }
            #login-screen:not(.hidden) > div:not(:has(#login-form)) { display: none !important; }
            #login-screen:not(.hidden) > div:has(#login-form) { width: 100% !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; margin: 0 !important; padding: 0 !important; }
            #login-form { width: 100% !important; max-width: 360px !important; background: #0c0c0c !important; border: 1px solid #222 !important; border-radius: 16px !important; padding: 40px 25px !important; box-shadow: 0 15px 40px rgba(0,0,0,0.8) !important; text-align: center !important; margin: 0 auto !important; display: block !important; box-sizing: border-box !important; }
            
            #login-form p, #login-form label, #login-form h1, #login-form h2, #login-form h3 { display: none !important; }
            #login-form span:not(.mobile-login-header span) { display: none !important; }
            
            #login-form input { width: 100% !important; background: #000 !important; border: 1px solid #333 !important; color: #fff !important; padding: 16px !important; font-size: 16px !important; border-radius: 8px !important; margin-bottom: 15px !important; box-sizing: border-box !important; text-align: center !important; }
            #login-form button[type="submit"] { width: 100% !important; background: #fff !important; color: #000 !important; padding: 16px !important; font-size: 16px !important; font-weight: 900 !important; border: none !important; border-radius: 8px !important; margin-top: 10px !important; cursor: pointer !important; }
            .mobile-login-header { display: block !important; }

            .search-wrapper { flex-direction: column !important; height: auto !important; gap: 15px !important; }
            #main-search { font-size: 16px !important; height: 55px !important; padding: 10px 15px !important; border-radius: 8px !important; width: 100% !important; }
            #main-search::placeholder { font-size: 12px !important; }
            .btn-scan-mobile { display: flex !important; align-items: center; justify-content: center; font-size: 16px !important; height: 55px !important; padding: 0 !important; border-radius: 8px !important; border-width: 2px !important; width: 100% !important; }

            .card-wrapper { flex-direction: column; gap: 15px; }
            .card-main, .stock-box { padding: 20px; }
            .stock-value { font-size: 45px !important; } 
            
            .grid-details { grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; padding-top: 15px; }
            .title-text { font-size: 20px; }
            .label-text { font-size: 10px; }
            .value-text { font-size: 13px; }
            .input-style { font-size: 12px; padding: 8px; margin-bottom: 5px; max-width: 100%; width: 100%; }
            .btn-save, .btn-cancel { padding: 8px 10px; font-size: 12px; }
            .btn-edit { padding: 6px; font-size: 10px; margin-top: 5px; width: 100%; }
            .flex-edit { flex-direction: column; align-items: stretch; gap: 5px; width: 100%; }
            .edit-btn-group { width: 100%; display: flex; gap: 5px; }
            svg { max-height: 30px !important; width: auto !important; }

            .btn-print-mobile { width: 100% !important; margin-top: 15px; padding: 12px !important; }
            .legal-footer { font-size: 10px; padding: 10px 15px; }

            .lightbox-prev, .lightbox-next { font-size: 24px; padding: 10px 15px; }
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
            .lightbox-close { top: 15px; right: 15px; width: 40px; height: 40px; font-size: 25px; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">TERMINUX INITIALIZING...</div>

    <div id="login-screen" class="split-layout hidden">
        <div class="brand-section">
            <h1 class="brand-title">TERMINUX</h1>
            <p class="brand-subtitle">Warehouse Management System</p>
            <div>
                <a href="https://terminux.com.tr" target="_blank" class="brand-website">terminux.com.tr</a>
            </div>
        </div>
        
        <div class="form-section">
            <div class="login-header">
                <h2>Sisteme Giriş</h2>
                <p>Devam etmek için bilgilerinizi girin.</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="username" required autocomplete="off" spellcheck="false">
                    <label>Kullanıcı Adı</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" required>
                    <label>Şifre</label>
                </div>
                <button type="submit" class="btn-submit">Giriş Yap</button>
                <a href="lens.html" class="btn-lens-redirect">LENS MERKEZİNE GİRİŞ</a>
            </form>
        </div>
    </div>

    <div id="app-screen" class="hidden" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
        <header style="padding: 25px 50px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; background: #050505;">
            <div style="font-weight: 800; font-size: 28px; letter-spacing: -1px; color: #fff;">TERMINUX <span style="color:#444; font-size:14px; font-weight: 600;">WMS TERMINAL</span></div>
            <div style="display: flex; gap: 30px; align-items: center;">
                <a href="lens.html" style="background: rgba(0, 204, 255, 0.1); color: #00ccff; border: 1px solid rgba(0, 204, 255, 0.3); padding: 10px 20px; text-decoration: none; font-size: 12px; font-weight: 800; border-radius: 4px; transition: 0.3s;" onmouseover="this.style.background='#00ccff'; this.style.color='#000'" onmouseout="this.style.background='rgba(0, 204, 255, 0.1)'; this.style.color='#00ccff'">LENS MERKEZİ</a>
                <span style="font-size: 13px; color: #666; letter-spacing: 1px;">OPERATÖR: <b id="operator-name" style="color: #00ff00;"></b></span>
                <button id="btn-logout" style="background: #ffffff; color: #000000; border: none; padding: 10px 25px; cursor: pointer; font-size: 12px; font-weight: 800; border-radius: 4px; transition: 0.2s;">GÜVENLİ ÇIKIŞ</button>
            </div>
        </header>
        <main style="flex: 1; padding: 50px; max-width: 1400px; margin: 0 auto; width: 100%; background: #000; overflow-y: auto;">
            <div style="margin-bottom: 50px; position: relative;">
                <div class="search-wrapper" style="display: flex; gap: 15px; width: 100%;">
                    <input type="text" id="main-search" placeholder="BARKOD, REF NO VEYA ÜRÜN İSMİ YAZIN..." style="flex: 1; width: 100%; background: #080808; border: 2px solid #222; color: #00ff00; padding: 35px; font-size: 32px; font-family: monospace; outline: none; border-radius: 8px; transition: 0.2s; box-shadow: 0 10px 30px rgba(0,0,0,0.5);" autocomplete="off">
                    <button id="btn-scan-mobile" class="btn-scan-mobile" onclick="openScanner()">BARKOD TARA</button>
                </div>
                <div id="dropdown-results" style="display: none; position: absolute; top: 110%; left: 0; width: 100%; background: #0a0a0a; border: 1px solid #333; z-index: 100; max-height: 500px; overflow-y: auto; border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);"></div>
            </div>
            <div id="result-container" style="display: none;"></div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
