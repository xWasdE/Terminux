<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINUX - İş Planı</title>
    <style>
        :root {
            --bg-main: #050505;
            --bg-panel: rgba(10, 10, 10, 0.85);
            --bg-card: linear-gradient(145deg, #111111, #0a0a0a);
            --border-color: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #777777;
            --accent-cyan: #00e5ff;
            --accent-green: #00ff66;
            --accent-red: #ff3366;
            --accent-yellow: #ffcc00;
            --accent-purple: #b026ff;
        }

        body {
            background-color: var(--bg-main);
            /* Endüstriyel Noktalı Grid Arkaplan */
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-title { font-size: 32px; font-weight: 900; letter-spacing: 2px; color: #fff; line-height: 1; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .brand-subtitle { color: var(--accent-green); font-size: 11px; font-weight: 800; letter-spacing: 6px; text-transform: uppercase; margin-top: 5px; }

        .btn-primary {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 12px 28px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary:hover { background: #66eeff; box-shadow: 0 6px 25px rgba(0, 229, 255, 0.4); transform: translateY(-2px); }
        .btn-primary:active { transform: scale(0.98); }

        .notification-banner {
            display: none;
            background: linear-gradient(90deg, rgba(255, 51, 102, 0.15), rgba(255, 51, 102, 0.05));
            border-left: 4px solid var(--accent-red);
            color: #fff;
            padding: 15px 25px;
            border-radius: 6px;
            margin-bottom: 25px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .notification-banner.active { display: flex; }

        /* GRID YAPISI */
        .schedule-scroller {
            display: grid;
            grid-template-columns: repeat(7, minmax(240px, 1fr)); 
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 20px;
            min-height: 75vh;
        }
        .schedule-scroller::-webkit-scrollbar { height: 8px; }
        .schedule-scroller::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); border-radius: 4px; }
        .schedule-scroller::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .schedule-scroller::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

        .day-column {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        .day-column.weekend { background: rgba(20, 5, 5, 0.85); border-color: rgba(255, 51, 102, 0.1); }
        
        .day-column.today {
            border: 1px solid rgba(0, 229, 255, 0.3);
            background: rgba(0, 20, 30, 0.85);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
        }
        .day-column.today::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--accent-cyan);
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        .day-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.4);
        }

        .day-name { font-size: 13px; font-weight: 900; letter-spacing: 1px; color: #eee; text-transform: uppercase; }
        .day-column.today .day-name { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
        .day-name.weekend { color: var(--accent-red); }
        .day-date { font-size: 11px; color: var(--text-muted); font-family: monospace; font-weight: bold; background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 4px; }
        .day-column.today .day-date { color: var(--accent-cyan); background: rgba(0, 229, 255, 0.1); }

        .timeline-container { flex: 1; display: flex; flex-direction: column; padding: 10px 15px 20px 15px; }

        /* ÇİZELGE SAAT SATIRLARI */
        .hour-block { display: flex; min-height: 50px; position: relative; }
        .hour-block::after {
            content: ''; position: absolute; left: 45px; right: 0; bottom: 0;
            height: 1px; background: rgba(255,255,255,0.03);
        }

        .hour-label {
            width: 45px; font-size: 10px; color: #555; padding: 12px 10px 0 0;
            text-align: right; font-family: monospace; font-weight: bold; flex-shrink: 0;
        }

        .hour-content { flex: 1; padding: 5px 0 10px 10px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid rgba(255,255,255,0.05); }

        /* BOŞ ALAN (HOVER İLE ÇIKAN ARTI) */
        .empty-slot {
            flex: 1; min-height: 35px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 1px dashed transparent; transition: all 0.2s ease;
        }
        .empty-slot .add-icon {
            opacity: 0; color: var(--accent-cyan); font-size: 16px; font-weight: 900;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 229, 255, 0.1); width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center; border-radius: 50%;
        }
        .empty-slot:hover { border-color: rgba(0, 229, 255, 0.3); background: rgba(0, 229, 255, 0.02); }
        .empty-slot:hover .add-icon { opacity: 1; transform: scale(1.1); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }

        /* GÖREV KARTLARI */
        .task-card {
            background: var(--bg-card);
            border-left: 3px solid var(--accent-purple);
            border-radius: 6px;
            padding: 10px 12px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.02);
            border-right: 1px solid rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .task-card:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.5); filter: brightness(1.1); }
        
        .task-card.fixed-task { border-left-color: var(--accent-yellow); }
        .task-card.mesai-disi { border-left-color: var(--accent-red); }
        
        .task-card.completed { opacity: 0.35; border-left-color: var(--accent-green); filter: grayscale(50%); }
        .task-card.completed:hover { opacity: 0.6; filter: grayscale(0%); }
        .task-card.completed .task-title { text-decoration: line-through; color: #888; }

        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        
        .task-badges { display: flex; gap: 5px; }
        .badge { font-size: 8px; padding: 3px 5px; border-radius: 3px; font-weight: 900; letter-spacing: 0.5px; }
        .badge-reminder { background: var(--accent-red); color: #fff; box-shadow: 0 0 8px rgba(255, 51, 102, 0.4); }
        .badge-fixed { background: var(--accent-yellow); color: #000; box-shadow: 0 0 8px rgba(255, 204, 0, 0.4); }

        .task-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .task-notes { font-size: 10px; color: #aaa; background: rgba(0,0,0,0.4); padding: 6px; border-radius: 4px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.03); word-break: break-word; }

        .task-controls { display: flex; gap: 8px; }
        .btn-action {
            flex: 1; background: rgba(255,255,255,0.05); border: none; color: #999;
            padding: 6px; border-radius: 4px; font-size: 9px; font-weight: 800; cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
        }
        .btn-action.complete:hover { background: rgba(0, 255, 102, 0.15); color: var(--accent-green); box-shadow: 0 0 10px rgba(0, 255, 102, 0.1); }
        .btn-action.delete:hover { background: rgba(255, 51, 102, 0.15); color: var(--accent-red); box-shadow: 0 0 10px rgba(255, 51, 102, 0.1); }

        /* MODAL EKRANI */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 1000;
            justify-content: center; align-items: center;
        }

        .modal-box {
            background: #0a0a0a; width: 100%; max-width: 450px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,1);
            position: relative; overflow: hidden;
        }
        .modal-box::before {
            content:''; position: absolute; top:0; left:0; right:0; height:4px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
        }

        .modal-title { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 25px; letter-spacing: 1px; }

        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 11px; color: #888; font-weight: 800; margin-bottom: 6px; letter-spacing: 0.5px; }
        .form-input {
            width: 100%; background: #000; border: 1px solid #222; color: #fff;
            padding: 12px; border-radius: 6px; font-family: inherit; font-size: 14px; box-sizing: border-box; transition: all 0.2s;
        }
        .form-input:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); }
        
        .modal-footer { display: flex; gap: 15px; margin-top: 30px; }
        .btn-modal { flex: 1; padding: 14px; border: none; border-radius: 6px; font-weight: 900; font-size: 12px; cursor: pointer; letter-spacing: 1px; transition: all 0.2s; }
        .btn-save { background: var(--accent-green); color: #000; box-shadow: 0 4px 15px rgba(0, 255, 102, 0.2); }
        .btn-save:hover { background: #33ff88; transform: translateY(-2px); }
        .btn-cancel { background: #222; color: #aaa; }
        .btn-cancel:hover { background: #333; color: #fff; }

        @media (max-width: 1400px) {
            .schedule-scroller { grid-template-columns: repeat(7, minmax(280px, 1fr)); }
        }
        @media (max-width: 768px) {
            .schedule-scroller { grid-template-columns: repeat(7, minmax(300px, 1fr)); }
            .header-container { flex-direction: column; align-items: flex-start; text-align: left; }
            .btn-primary { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="reminder-banner" class="notification-banner">
        <div style="display: flex; align-items: center; gap: 15px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <div id="reminder-text" style="font-size: 13px; font-weight: 800; letter-spacing: 0.5px;"></div>
        </div>
        <button onclick="document.getElementById('reminder-banner').classList.remove('active')" style="background:transparent; border:none; color:#fff; font-size:24px; font-weight:bold; cursor:pointer;">×</button>
    </div>

    <div class="header-container">
        <div>
            <div class="brand-title">TERMINUX KROKİ</div>
            <div class="brand-subtitle">Operasyon ve Zaman Çizelgesi</div>
        </div>
        <button class="btn-primary" onclick="openTaskModal(null, null)">+ MANUEL İŞ GİRİŞİ</button>
    </div>

    <div class="schedule-scroller" id="week-grid">
        <!-- JS Tarafından Doldurulacak -->
    </div>

    <div id="task-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title" id="modal-title-text">YENİ OPERASYON PLANI</div>
            <form id="task-form">
                <div class="form-group">
                    <label class="form-label">İŞ / GÖREV BAŞLIĞI</label>
                    <input type="text" id="task-title" class="form-input" placeholder="Örn: Bodrum Depo Tam Sayım" required>
                </div>
                
                <div class="form-group" style="background: rgba(255, 204, 0, 0.05); padding: 15px; border-radius: 6px; border: 1px solid rgba(255, 204, 0, 0.1);">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <input type="checkbox" id="task-fixed" style="width: 18px; height: 18px; accent-color: var(--accent-yellow);">
                        <label style="color: var(--accent-yellow); font-size: 12px; font-weight: 900; margin: 0; cursor: pointer;" for="task-fixed">SABİT OPERASYON (Her Hafta Tekrarlar)</label>
                    </div>
                    <div style="font-size: 10px; color: #888; margin-top: 6px; margin-left: 30px; font-weight: bold;">Sadece seçilen gün ve saat baz alınır, tarihten bağımsız sisteme kazınır.</div>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" id="label-date">TARİH</label>
                        <input type="date" id="task-date" class="form-input" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">SAAT</label>
                        <input type="time" id="task-time" class="form-input" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">OPERASYON NOTLARI (İsteğe Bağlı)</label>
                    <textarea id="task-notes" class="form-input" rows="2" placeholder="Detay ekleyebilirsiniz..."></textarea>
                </div>
                <div class="form-group" style="display: flex; align-items: center; gap: 12px; margin-top: 20px; background: rgba(255, 51, 102, 0.05); padding: 12px; border-radius: 6px; border: 1px solid rgba(255, 51, 102, 0.1);">
                    <input type="checkbox" id="task-reminder" style="width: 18px; height: 18px; accent-color: var(--accent-red);">
                    <label style="color: #fff; font-size: 12px; font-weight: bold; margin: 0; cursor: pointer;" for="task-reminder">Yüksek Öncelik (Sistem Hatırlatıcısı Kur)</label>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn-modal btn-save">SİSTEME İŞLE</button>
                    <button type="button" class="btn-modal btn-cancel" onclick="closeTaskModal()">İPTAL</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="is-plani.js"></script>
</body>
</html>
