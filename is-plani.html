<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINUX - İş Planı</title>
    <style>
        :root {
            --bg-main: #050505;
            --bg-panel: #0a0a0a;
            --bg-card: #111111;
            --border-color: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #666666;
            --accent-cyan: #00ccff;
            --accent-green: #00ff00;
            --accent-red: #ff3333;
            --accent-yellow: #ffbc00;
            --accent-purple: #b026ff;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-title { font-size: 28px; font-weight: 900; letter-spacing: 2px; color: #fff; line-height: 1.2; }
        .brand-subtitle { color: var(--accent-green); font-size: 11px; font-weight: bold; letter-spacing: 4px; text-transform: uppercase; }

        .btn-primary {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.2);
            transition: all 0.2s;
        }
        .btn-primary:hover { background: #33d6ff; box-shadow: 0 0 20px rgba(0, 204, 255, 0.4); }
        .btn-primary:active { transform: scale(0.98); }

        .notification-banner {
            display: none;
            background: rgba(255, 51, 51, 0.1);
            border-left: 4px solid var(--accent-red);
            color: #fff;
            padding: 15px 20px;
            border-radius: 4px;
            margin-bottom: 25px;
            align-items: center;
            justify-content: space-between;
        }
        .notification-banner.active { display: flex; }

        /* GRID YAPISI - EKRANA TAM SIĞDIRMA */
        .schedule-scroller {
            display: grid;
            grid-template-columns: repeat(7, minmax(220px, 1fr)); /* Ekrana göre otomatik daralır/genişler */
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            min-height: 75vh;
        }
        .schedule-scroller::-webkit-scrollbar { height: 8px; }
        .schedule-scroller::-webkit-scrollbar-track { background: var(--bg-main); }
        .schedule-scroller::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .day-column {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
        }

        .day-column.today {
            border-color: rgba(0, 204, 255, 0.4);
            background: #080c11; /* Çok hafif mavimsi karanlık arka plan */
        }

        .day-header {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d0d0d;
            border-radius: 6px 6px 0 0;
        }

        .day-column.today .day-header { border-bottom-color: rgba(0, 204, 255, 0.3); }

        .day-name { font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
        .day-column.today .day-name { color: var(--accent-cyan); }
        .day-name.weekend { color: var(--accent-red); }
        .day-date { font-size: 11px; color: var(--text-muted); font-family: monospace; }

        .timeline-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-bottom: 15px;
        }

        /* ÇİZELGE SAAT SATIRLARI */
        .hour-block {
            display: flex;
            border-bottom: 1px solid #141414;
            min-height: 45px;
        }
        .hour-block:last-child { border-bottom: none; }

        .hour-label {
            width: 40px;
            font-size: 10px;
            color: #555;
            padding: 6px 5px 0 0;
            text-align: right;
            font-family: monospace;
            border-right: 1px solid #1a1a1a;
            flex-shrink: 0;
        }

        .hour-content {
            flex: 1;
            padding: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* BOŞ ALAN (HOVER İLE ÇIKAN ARTI) */
        .empty-slot {
            flex: 1;
            min-height: 35px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .empty-slot .add-icon {
            opacity: 0; /* Normalde gizli */
            color: var(--accent-cyan);
            font-size: 18px;
            font-weight: bold;
            transition: opacity 0.2s, transform 0.2s;
        }
        .empty-slot:hover { background: rgba(0, 204, 255, 0.05); }
        .empty-slot:hover .add-icon { opacity: 1; transform: scale(1.2); }

        /* GÖREV KARTLARI */
        .task-card {
            background: #111;
            border-left: 2px solid var(--accent-purple);
            border-radius: 4px;
            padding: 8px 10px;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .task-card:hover { filter: brightness(1.2); }
        .task-card.fixed-task { border-left-color: var(--accent-yellow); }
        .task-card.mesai-disi { border-left-color: var(--accent-red); }
        
        .task-card.completed { opacity: 0.4; border-left-color: var(--accent-green); }
        .task-card.completed .task-title { text-decoration: line-through; color: #666; }

        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        
        .task-badges { display: flex; gap: 4px; }
        .badge { font-size: 8px; padding: 2px 4px; border-radius: 2px; font-weight: bold; letter-spacing: 0.5px; }
        .badge-reminder { background: var(--accent-red); color: #fff; }
        .badge-fixed { background: var(--accent-yellow); color: #000; }

        .task-title { font-size: 12px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; color: #ddd; }
        .task-notes { font-size: 10px; color: #888; background: #080808; padding: 5px; border-radius: 2px; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .task-controls { display: flex; gap: 5px; }
        .btn-action {
            flex: 1;
            background: #1a1a1a;
            border: none;
            color: #888;
            padding: 4px;
            border-radius: 2px;
            font-size: 9px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action.complete:hover { background: rgba(0, 255, 0, 0.15); color: var(--accent-green); }
        .btn-action.delete:hover { background: rgba(255, 51, 51, 0.15); color: var(--accent-red); }

        /* MODAL (YENİ İŞ EKLEME) */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 1000;
            justify-content: center; align-items: center;
        }

        .modal-box {
            background: var(--bg-panel); width: 100%; max-width: 420px;
            border-radius: 8px; border: 1px solid #222; padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        .modal-title {
            font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 20px;
            letter-spacing: 1px; border-bottom: 1px solid #222; padding-bottom: 10px;
        }

        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 10px; color: #888; font-weight: bold; margin-bottom: 5px; letter-spacing: 0.5px; }
        .form-input {
            width: 100%; background: #000; border: 1px solid #222; color: #fff;
            padding: 10px; border-radius: 4px; font-family: inherit; font-size: 13px; box-sizing: border-box; transition: border-color 0.2s;
        }
        .form-input:focus { outline: none; border-color: var(--accent-cyan); }
        
        .modal-footer { display: flex; gap: 10px; margin-top: 25px; }
        .btn-modal { flex: 1; padding: 12px; border: none; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; letter-spacing: 1px; }
        .btn-save { background: var(--accent-green); color: #000; }
        .btn-cancel { background: #222; color: #888; }
        .btn-cancel:hover { background: #333; color: #fff; }

        @media (max-width: 1200px) {
            .schedule-scroller { grid-template-columns: repeat(7, minmax(260px, 1fr)); }
        }
    </style>
</head>
<body>

    <div id="reminder-banner" class="notification-banner">
        <div style="display: flex; align-items: center; gap: 15px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <div id="reminder-text" style="font-size: 12px; font-weight:bold;"></div>
        </div>
        <button onclick="document.getElementById('reminder-banner').classList.remove('active')" style="background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer;">×</button>
    </div>

    <div class="header-container">
        <div>
            <div class="brand-title">TERMINUX KROKİ</div>
            <div class="brand-subtitle">Zaman ve Operasyon Çizelgesi</div>
        </div>
        <button class="btn-primary" onclick="openTaskModal(null, null)">+ MANUEL İŞ GİRİŞİ</button>
    </div>

    <div class="schedule-scroller" id="week-grid">
        <!-- JS Tarafından Doldurulacak -->
    </div>

    <div id="task-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title" id="modal-title-text">YENİ OPERASYON PLANI</div>
            <form id="task-form">
                <div class="form-group">
                    <label class="form-label">İŞ/GÖREV BAŞLIĞI</label>
                    <input type="text" id="task-title" class="form-input" placeholder="Örn: Bodrum Depo Sayımı" required>
                </div>
                
                <div class="form-group" style="background: #0d0d0d; padding: 12px; border-radius: 4px; border: 1px dashed #333;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="task-fixed" style="width: 16px; height: 16px; accent-color: var(--accent-yellow);">
                        <label style="color: var(--accent-yellow); font-size: 11px; font-weight: bold; margin: 0; cursor: pointer;" for="task-fixed">SABİT OPERASYON (Her Hafta Tekrarlar)</label>
                    </div>
                    <div style="font-size: 9px; color: #555; margin-top: 4px; margin-left: 26px;">Sadece seçilen gün ve saat baz alınır, tarihten bağımsız kalıcıdır.</div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" id="label-date">TARİH</label>
                        <input type="date" id="task-date" class="form-input" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">SAAT</label>
                        <input type="time" id="task-time" class="form-input" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">OPERASYON NOTLARI (İsteğe Bağlı)</label>
                    <textarea id="task-notes" class="form-input" rows="2" placeholder="Kısa notlar eklenebilir..."></textarea>
                </div>
                <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 15px;">
                    <input type="checkbox" id="task-reminder" style="width: 16px; height: 16px; accent-color: var(--accent-red);">
                    <label style="color: #ccc; font-size: 11px; margin: 0; cursor: pointer;" for="task-reminder">Yüksek Öncelik (Hatırlatıcı Banner'da Göster)</label>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn-modal btn-save">SİSTEME İŞLE</button>
                    <button type="button" class="btn-modal btn-cancel" onclick="closeTaskModal()">İPTAL</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="is-plani.js"></script>
</body>
</html>
