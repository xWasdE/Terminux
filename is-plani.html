<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINUX - İş Planı</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .plan-container { padding: 20px; max-width: 1200px; margin: 0 auto; color: #fff; }
        .notification-banner { display: none; background: #ffbc00; color: #000; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 15px rgba(255, 188, 0, 0.3); align-items: center; justify-content: space-between; }
        .notification-banner.active { display: flex; }
        .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .btn-add-task { background: #00ccff; color: #000; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 204, 255, 0.2); }
        .week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .day-col { background: #111; border: 1px solid #1a1a1a; border-radius: 8px; padding: 15px; min-height: 400px; }
        .day-title { color: #b026ff; font-size: 14px; font-weight: 800; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .day-title.weekend { color: #ff3333; }
        .task-card { background: #1a1a1a; border-left: 4px solid #00ccff; padding: 15px; border-radius: 6px; margin-bottom: 12px; position: relative; }
        .task-card.completed { opacity: 0.5; border-left-color: #00ff00; }
        .task-card.completed .task-title { text-decoration: line-through; color: #888; }
        .task-card.mesai-disi { border-left-color: #ffbc00; }
        .task-time { font-size: 11px; color: #888; margin-bottom: 5px; font-family: monospace; }
        .task-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .task-notes { font-size: 12px; color: #ccc; margin-bottom: 10px; line-height: 1.4; }
        .task-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .badge-mesai { background: #ffbc00; color: #000; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; position: absolute; top: 10px; right: 10px; }
        .badge-reminder { background: #ff3333; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; position: absolute; top: 10px; right: 85px; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #111; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #888; font-size: 12px; margin-bottom: 5px; }
        .form-control { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; box-sizing: border-box; }
        .form-control:focus { outline: none; border-color: #00ccff; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
        .checkbox-group input { width: 18px; height: 18px; accent-color: #00ccff; }
        .modal-actions { display: flex; gap: 15px; margin-top: 25px; }
        .btn-save { flex: 1; background: #00ff00; color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-cancel { flex: 1; background: #333; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="plan-container">
        <div id="reminder-banner" class="notification-banner">
            <div id="reminder-text">Önemli Hatırlatma: Bugün veya yarına ait bekleyen işleriniz var!</div>
            <button onclick="document.getElementById('reminder-banner').classList.remove('active')" style="background:transparent; border:none; font-size:20px; cursor:pointer; color:#000;">×</button>
        </div>

        <div class="plan-header">
            <div>
                <div style="font-size: 24px; font-weight: 900; letter-spacing: 1px;">HAFTALIK İŞ PLANI</div>
                <div style="color: #0f0; font-size: 12px; letter-spacing: 2px;">OPERASYON TAKVİMİ</div>
            </div>
            <button class="btn-add-task" onclick="openTaskModal()">+ YENİ İŞ EKLE</button>
        </div>

        <div class="week-grid" id="week-grid"></div>
    </div>

    <div id="task-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 20px;">YENİ İŞ PLANI</div>
            <form id="task-form">
                <div class="form-group">
                    <label>GÖREV BAŞLIĞI</label>
                    <input type="text" id="task-title" class="form-control" required>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>TARİH</label>
                        <input type="date" id="task-date" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>SAAT</label>
                        <input type="time" id="task-time" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>NOTLAR / DETAYLAR</label>
                    <textarea id="task-notes" class="form-control" rows="3"></textarea>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="task-reminder">
                    <label style="margin:0; color:#fff;">Önemli - Bildirim Hatırlatıcısı Kur</label>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-save">KAYDET</button>
                    <button type="button" class="btn-cancel" onclick="closeTaskModal()">İPTAL</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="is-plani.js"></script>
</body>
</html>
