<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminux | Geçici Veri Aktarım Aracı</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background: #050505; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #111; border: 1px solid #333; padding: 30px; border-radius: 12px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { color: #00ccff; border-bottom: 1px solid #333; padding-bottom: 15px; margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 20px; background: #0a0a0a; padding: 15px; border-radius: 8px; border: 1px dashed #444; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #ffbc00; margin-bottom: 10px; }
        .form-group input[type="file"] { width: 100%; color: #aaa; font-size: 13px; }
        .btn-upload { background: #00ff00; color: #000; border: none; padding: 15px; width: 100%; font-size: 16px; font-weight: 900; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-upload:hover { background: #fff; box-shadow: 0 0 15px rgba(0,255,0,0.5); }
        .btn-upload:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }
        #log-area { margin-top: 20px; background: #000; padding: 15px; border-radius: 8px; border: 1px solid #222; font-family: monospace; font-size: 12px; height: 150px; overflow-y: auto; color: #aaa; }
        .success { color: #00ff00; } .error { color: #ff3333; } .info { color: #00ccff; } .warning { color: #ffbc00; }
    </style>
</head>
<body>

    <div class="container">
        <h2>DEPO AMELİYATHANE<br><span style="font-size:14px; color:#aaa;">Geçici Veri Birleştirme & Aktarım Aracı</span></h2>
        
        <div style="background: rgba(0,204,255,0.1); border: 1px solid #00ccff; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 12px; text-align: center; color: #00ccff; font-weight: bold;">
            HEDEF LOKASYON: <span id="display-loc">Yükleniyor...</span>
        </div>

        <div class="form-group">
            <label>1. ADRES DOSYASI (Ürün Kodu, Ürün Adı, Stok Adresi)</label>
            <input type="file" id="file-adres" accept=".xlsx, .xls">
        </div>

        <div class="form-group">
            <label>2. STOK / SAYIM DOSYASI (Ürün Kodu, Ürün Adı, sayım)</label>
            <input type="file" id="file-sayim" accept=".xlsx, .xls">
        </div>

        <div class="form-group">
            <label>3. MİAT DOSYASI (Ürün Kodu, Ürün Adı, Miat) - <span style="color:#888;">Opsiyonel</span></label>
            <input type="file" id="file-miat" accept=".xlsx, .xls">
        </div>

        <button class="btn-upload" id="btn-process">DOSYALARI BİRLEŞTİR VE AKTAR</button>

        <div id="log-area">Sistem hazır. Lütfen dosyaları seçin ve aktarımı başlatın...</div>
    </div>

    <script type="module">
        import { db } from './admin.js';
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let activeLoc = localStorage.getItem('active_loc') || localStorage.getItem('user_loc') || 'bodrum';
        if (activeLoc === 'tumu') activeLoc = 'bodrum';
        
        document.getElementById('display-loc').innerText = activeLoc.toUpperCase();

        const dbAdreslerCol = activeLoc === 'merkez' ? 'kilitli_depo' : 'kilitli_depo_' + activeLoc;
        const dbAmeliyatCol = activeLoc === 'merkez' ? 'depo_ameliyathane' : 'depo_ameliyathane_' + activeLoc;

        const log = (msg, type = 'info') => {
            const area = document.getElementById('log-area');
            area.innerHTML += `<div class="${type}">> ${msg}</div>`;
            area.scrollTop = area.scrollHeight;
        };

        const readExcel = (fileId) => {
            return new Promise((resolve, reject) => {
                const file = document.getElementById(fileId).files[0];
                if (!file) { resolve([]); return; }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(firstSheet, {raw: false, dateNF: 'dd.mm.yyyy'});
                        resolve(rows);
                    } catch (err) { reject(err); }
                };
                reader.readAsArrayBuffer(file);
            });
        };

        const getNormalizedKey = (row, possibleKeys) => {
            const keys = Object.keys(row);
            const foundKey = keys.find(k => possibleKeys.includes(k.trim().toLowerCase()));
            return foundKey ? row[foundKey] : null;
        };

        document.getElementById('btn-process').addEventListener('click', async () => {
            const btn = document.getElementById('btn-process');
            btn.disabled = true;
            btn.innerText = "İŞLENİYOR, LÜTFEN BEKLEYİN...";
            document.getElementById('log-area').innerHTML = '';
            
            try {
                log("1. Dosyalar okunuyor...");
                const adresRows = await readExcel('file-adres');
                const sayimRows = await readExcel('file-sayim');
                const miatRows = await readExcel('file-miat');

                if (adresRows.length === 0 || sayimRows.length === 0) {
                    log("HATA: Adres ve Sayım dosyaları zorunludur!", "error");
                    btn.disabled = false; btn.innerText = "DOSYALARI BİRLEŞTİR VE AKTAR";
                    return;
                }

                log(`Okunan Satırlar -> Adres: ${adresRows.length}, Sayım: ${sayimRows.length}, Miat: ${miatRows.length}`);

                const mergedData = {};
                let eksikAdresSayisi = 0;

                // ADRES DOSYASINI İŞLE
                adresRows.forEach(row => {
                    let rawCode = getNormalizedKey(row, ['ürün kodu', 'urun kodu', 'kod']);
                    let rawAdres = getNormalizedKey(row, ['stok adresi', 'adres']);
                    let rawName = getNormalizedKey(row, ['ürün adı', 'ürün ismi', 'urun adi']);

                    if (rawCode) {
                        let code = String(rawCode).trim();
                        if (rawAdres && String(rawAdres).trim() !== "") {
                            let adres = String(rawAdres).replace(/^BDA/i, '').trim(); 
                            mergedData[code] = {
                                urunKodu: code,
                                urunAdi: rawName ? String(rawName).trim() : "İsimsiz Ürün",
                                adres: adres,
                                qty: 0,
                                miat: '31.12.2099'
                            };
                        }
                    }
                });

                // SAYIM DOSYASINI İŞLE VE BİRLEŞTİR
                sayimRows.forEach(row => {
                    let rawCode = getNormalizedKey(row, ['ürün kodu', 'urun kodu', 'kod']);
                    let rawQty = getNormalizedKey(row, ['sayım', 'sayim', 'stok', 'miktar']);

                    if (rawCode && rawQty) {
                        let code = String(rawCode).trim();
                        if (mergedData[code]) {
                            mergedData[code].qty += parseInt(rawQty) || 0;
                        } else {
                            eksikAdresSayisi++;
                        }
                    }
                });

                if (eksikAdresSayisi > 0) {
                    log(`BİLGİ: Sayım dosyasındaki ${eksikAdresSayisi} adet ürün, Adres dosyasında adresi boş (veya hiç olmadığı) için bilinçli olarak atlandı.`, "warning");
                }

                // MİAT DOSYASINI İŞLE (VARSA)
                miatRows.forEach(row => {
                    let rawCode = getNormalizedKey(row, ['ürün kodu', 'urun kodu', 'kod']);
                    let rawMiat = getNormalizedKey(row, ['miat', 'miad', 'tarih']);

                    if (rawCode && rawMiat) {
                        let code = String(rawCode).trim();
                        if (mergedData[code]) {
                            mergedData[code].miat = String(rawMiat).trim();
                        }
                    }
                });

                log(`2. Firebase Adres Haritası Çekiliyor (${activeLoc.toUpperCase()})...`);
                const adresDoc = await getDoc(doc(db, dbAdreslerCol, "adresler"));
                const systemAddresses = adresDoc.exists() ? adresDoc.data() : {};

                log(`3. Veritabanına Yükleme Başladı (${dbAmeliyatCol})...`);
                let successCount = 0;

                for (let key in mergedData) {
                    let item = mergedData[key];
                    if (item.qty <= 0) continue;

                    // Adresi sistemdeki shelfId ile eşleştir (Örn: 12.01.01 -> shelf-1-1)
                    let targetShelfId = Object.keys(systemAddresses).find(k => systemAddresses[k] === item.adres) || ("UNKNOWN_" + item.adres);
                    
                    let docId = targetShelfId + '_' + item.urunKodu;
                    let lots = {};
                    lots[item.miat] = item.qty;

                    await setDoc(doc(db, dbAmeliyatCol, docId), {
                        shelfId: targetShelfId,
                        urunKodu: item.urunKodu,
                        urunAdi: item.urunAdi,
                        adres: item.adres,
                        lots: lots
                    }, { merge: true });

                    successCount++;
                }

                log(`✅ İŞLEM BAŞARIYLA TAMAMLANDI! Toplam Aktarılan Ürün: ${successCount}`, "success");
                btn.innerText = "AKTARI BİTTİ, SAYFAYI KAPATABİLİRSİNİZ";

            } catch (err) {
                console.error(err);
                log("SİSTEM HATASI: Konsolu kontrol edin. " + err.message, "error");
                btn.disabled = false; btn.innerText = "DOSYALARI BİRLEŞTİR VE AKTAR";
            }
        });
    </script>
</body>
</html>
