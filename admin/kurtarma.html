<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminux | Acil Veritabanı Kurtarma</title>
    <style>
        body { background-color: #050505; color: #fff; font-family: monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .box { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #333; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(255,51,51,0.2); }
        h2 { color: #ff3333; margin-top: 0; font-family: sans-serif; font-weight: 900; letter-spacing: 1px; text-align: center; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: #00ccff; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #ffbc00; }
        .modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #000; padding: 15px; border: 1px solid #222; border-radius: 6px; margin-top: 5px; }
        .module-check { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #aaa; cursor: pointer; }
        .module-check input { width: 16px; height: 16px; accent-color: #ff3333; cursor: pointer; }
        button { width: 100%; padding: 15px; background: #ff3333; color: #fff; border: none; font-weight: 900; border-radius: 6px; cursor: pointer; margin-top: 20px; font-size: 15px; font-family: sans-serif; letter-spacing: 2px; transition: 0.2s; }
        button:hover { background: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.5); }
        #status { margin-top: 20px; font-size: 13px; font-weight: bold; padding: 12px; border-radius: 4px; text-align: center; border: 1px solid #333; background: #0a0a0a; }
        .warning { font-size: 11px; color: #aaa; margin-top: 20px; line-height: 1.5; font-family: sans-serif; text-align: center; }
        .warning b { color: #ff3333; }
    </style>
</head>
<body>

    <div class="box">
        <h2>VERİTABANI YETKİ KONTROLÜ</h2>
        
        <div class="form-group">
            <label>MÜDAHALE EDİLECEK E-POSTA ADRESİ</label>
            <input type="email" id="target-email" value="admin@terminux.com.tr">
        </div>
        
        <div class="form-group">
            <label>YENİ SİSTEM ROLÜ</label>
            <select id="target-role">
                <option value="admin">YÖNETİCİ (admin)</option>
                <option value="superadmin">SİSTEM YÖNETİCİSİ (superadmin)</option>
                <option value="user">STANDART PERSONEL (user)</option>
            </select>
        </div>

        <div class="form-group">
            <label>LOKASYON YETKİSİ (ID Olarak Yazın)</label>
            <input type="text" id="target-loc" value="tumu" placeholder="Örn: bodrum, merkez veya tumu">
        </div>

        <div class="form-group">
            <label>ZORLA EKLENECEK MODÜL YETKİLERİ</label>
            <div class="modules-grid">
                <label class="module-check"><input type="checkbox" id="mod-sayim" checked> Sayım Terminali</label>
                <label class="module-check"><input type="checkbox" id="mod-sevkiyat" checked> Sevkiyat Terminali</label>
                <label class="module-check"><input type="checkbox" id="mod-lens" checked> Lens Terminali</label>
                <label class="module-check"><input type="checkbox" id="mod-adres" checked> Adres Bulucu</label>
                <label class="module-check"><input type="checkbox" id="mod-depo" checked> Görsel Depo Yönetimi</label>
                <label class="module-check"><input type="checkbox" id="mod-stok" checked> Depo/Stok (Excel)</label>
                <label class="module-check"><input type="checkbox" id="mod-ayarlar" checked> Sistem Ayarları</label>
            </div>
        </div>

        <button id="btn-fix">VERİTABANINA YAZ</button>
        
        <div id="status">Sistem hazır. Lütfen aktif bir hesapla giriş yapmış olduğunuzdan emin olun.</div>
        
        <div class="warning">
            <b>DİKKAT:</b> İşleminiz bittikten sonra güvenlik sebebiyle <u>mutlaka bu dosyayı sunucudan silin!</u>
        </div>
    </div>

    <script type="module">
        import { db, auth } from './admin.js';
        import { collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const statusEl = document.getElementById('status');
        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                statusEl.style.borderColor = '#00ff00';
                statusEl.style.color = '#00ff00';
                statusEl.innerText = "Bağlantı Aktif. İstek Yapan: " + user.email;
            } else {
                statusEl.style.borderColor = '#ff3333';
                statusEl.style.color = '#ff3333';
                statusEl.innerText = "HATA: Oturum açık değil. Önce Terminux'a normal giriş yapın.";
            }
        });

        document.getElementById('btn-fix').addEventListener('click', async () => {
            if (!currentUser) return alert("Önce normal giriş ekranından bir hesapla giriş yapın!");
            
            const email = document.getElementById('target-email').value.trim().toLowerCase();
            const role = document.getElementById('target-role').value;
            const location = document.getElementById('target-loc').value.trim();
            
            if (!email || !location) return alert("Lütfen E-posta ve Lokasyon alanlarını doldurun.");

            const modules = {
                sayim: document.getElementById('mod-sayim').checked,
                sevkiyat: document.getElementById('mod-sevkiyat').checked,
                lens: document.getElementById('mod-lens').checked,
                adres: document.getElementById('mod-adres').checked,
                depo: document.getElementById('mod-depo').checked,
                stok: document.getElementById('mod-stok').checked,
                ayarlar: document.getElementById('mod-ayarlar').checked
            };

            statusEl.style.borderColor = '#ffbc00';
            statusEl.style.color = '#ffbc00';
            statusEl.innerText = "Veritabanında " + email + " aranıyor...";

            try {
                const q = query(collection(db, "users"), where("email", "==", email));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    statusEl.style.borderColor = '#ff3333';
                    statusEl.style.color = '#ff3333';
                    statusEl.innerText = "HATA: Bu e-posta adresine ait kayıt bulunamadı.";
                    return;
                }

                let targetUid = null;
                querySnapshot.forEach((document) => {
                    targetUid = document.id;
                });

                if (targetUid) {
                    statusEl.innerText = "Kayıt bulundu. Yeni yetkiler yazılıyor...";
                    
                    await updateDoc(doc(db, "users", targetUid), {
                        role: role,
                        location: location,
                        modules: modules,
                        status: 'active'
                    });

                    statusEl.style.borderColor = '#00ff00';
                    statusEl.style.color = '#00ff00';
                    statusEl.innerText = "BAŞARILI! " + email + " hesabı güncellendi. \nArtık giriş yapabilirsiniz.";
                }

            } catch (error) {
                console.error(error);
                statusEl.style.borderColor = '#ff3333';
                statusEl.style.color = '#ff3333';
                statusEl.innerText = "HATA: " + error.message;
            }
        });
    </script>
</body>
</html>
