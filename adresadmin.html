<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminux | Kroki Yönetimi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body, html { background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { background: #0a0a0a; padding: 40px; border-radius: 12px; border: 1px solid #333; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); }

        header { padding: 25px 50px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; background: #050505; flex-shrink: 0; }
        .header-title { font-weight: 800; font-size: 28px; letter-spacing: -1px; color: #fff; }
        .header-subtitle { color: #ffbc00; font-size: 14px; font-weight: 600; letter-spacing: 2px; }
        .btn-secondary { background: #111; color: #fff; border: 1px solid #333; padding: 12px 20px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; text-align: center; display: inline-block; text-decoration: none; }
        .btn-secondary:hover { background: #222; border-color: #555; }
        .btn-danger-main { background: rgba(255,51,51,0.1); color: #ff3333; border: 1px solid #ff3333; padding: 12px 20px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 12px; text-transform: uppercase; }
        .btn-danger-main:hover { background: #ff3333; color: #000; }
        
        main { flex: 1; padding: 40px 50px; overflow-y: auto; background: #000; display: none; }
        
        .setup-container { max-width: 600px; margin: 0 auto 50px auto; background: #080808; border: 1px solid #1a1a1a; padding: 40px; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
        .setup-title { font-size: 20px; font-weight: 800; margin-bottom: 25px; text-align: center; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; position: relative; }
        .input-group label { font-size: 11px; color: #666; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .input-group input, .input-group select { background: #0a0a0a; border: 1px solid #333; color: #00ff00; padding: 15px; font-family: monospace; font-size: 16px; border-radius: 6px; outline: none; transition: 0.2s; width: 100%; }
        .input-group input:focus, .input-group select:focus { border-color: #ffbc00; }
        
        .btn-primary { background: #ffbc00; color: #000; border: none; padding: 15px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; width: 100%; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-primary:hover { opacity: 0.8; }
        .btn-scan { background: #222; border: 1px solid #444; color: #fff; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-scan:hover { border-color: #ffbc00; color: #ffbc00; }
        
        .btn-action-sm { background: #111; color: #aaa; border: 1px solid #333; padding: 8px 12px; border-radius: 4px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 10px; text-transform: uppercase; }
        .btn-action-sm:hover { border-color: #ffbc00; color: #ffbc00; }
        .btn-danger { background: rgba(255,51,51,0.1); color: #ff3333; border: 1px solid rgba(255,51,51,0.3); }
        .btn-danger:hover { background: #ff3333; color: #000; border-color: #ff3333; }

        .list-container { max-width: 900px; margin: 0 auto; }
        
        /* Akordeon Tasarımı (Performans için) */
        .accordion-item { margin-bottom: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .accordion-header { padding: 15px 20px; background: #111; cursor: pointer; display: flex; justify-content: space-between; font-weight: bold; color: #ffbc00; transition: 0.2s; }
        .accordion-header:hover { background: #1a1a1a; }
        .accordion-body { display: none; padding: 10px; border-top: 1px solid #222; }
        .accordion-row { display: flex; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid #1a1a1a; align-items: center; }
        .accordion-row:last-child { border-bottom: none; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #00ff00; color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 12px; z-index: 99999; display: none; }

        #scanner-modal { display:none; position:fixed; z-index:20000; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(5px); padding: 20px; }
        #reader { width: 100%; max-width: 400px; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #333; }

        @media (max-width: 900px) {
            header { flex-direction: column; padding: 20px 15px; gap: 15px; text-align: center; }
            main { padding: 15px; }
            .setup-container { padding: 25px 20px; }
            .accordion-row { flex-direction: column; text-align: center; gap: 10px; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color:#fff; margin-bottom:25px; letter-spacing:1px;">YÖNETİCİ GİRİŞİ</h2>
            <input type="password" id="admin-pass" placeholder="Parola" style="width:100%; padding:15px; border-radius:6px; border:1px solid #444; background:#000; color:#fff; text-align:center; margin-bottom:20px; outline:none; font-size: 16px;">
            <button onclick="checkLogin()" class="btn-primary" style="margin-bottom:15px;">GİRİŞ YAP</button>
            <a href="adres.html" style="color:#888; font-size:12px; text-decoration:none;">Adres Bulucuya Dön</a>
        </div>
    </div>

    <header>
        <div class="header-title">TERMINUX <span class="header-subtitle">KROKİ YÖNETİMİ</span></div>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;">
            <button class="btn-danger-main" onclick="deleteAllAddresses()">TÜMÜNÜ SİL</button>
            <button class="btn-secondary" style="border-color: #00ff00; color: #00ff00;" onclick="triggerExcel()">EXCEL İÇERİ AKTAR</button>
            <button class="btn-secondary" onclick="exportExcel()">EXCEL İNDİR</button>
            <a href="adres.html" class="btn-secondary" style="border-color: rgba(255,255,255,0.3);">ADRES BULUCU</a>
        </div>
    </header>

    <main id="main-content">
        <div id="toast" class="toast">Kayıt Başarılı!</div>
        <input type="file" id="excel-import" style="display:none;" accept=".xlsx, .xls" onchange="importExcel(event)">

        <div class="setup-container">
            <div class="setup-title">ADRES TANIMLAMA / DÜZENLEME</div>
            <form id="mapping-form">
                <div class="input-group">
                    <label>ÜRÜN KODU / BARKOD</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="p-code" required autocomplete="off" placeholder="Örn: 61530328" data-barkod="" data-refno="" style="flex:1;">
                        <button type="button" class="btn-scan" onclick="openScanner()">TARA</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>ÜRÜN İSMİ (Otomatik Dolar)</label>
                    <input type="text" id="p-name" required autocomplete="off" placeholder="Örn: Ağrı Bandı Mavi">
                </div>
                <div class="input-group">
                    <label>RAF ADRESİ (Krokideki ID)</label>
                    <select id="p-address" required>
                        <option value="" disabled selected>Adres Seçin...</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">SİSTEME KAYDET</button>
            </form>
        </div>

        <div class="list-container" id="mapping-list">
            <!-- Akordeon Liste Buraya Gelecek -->
        </div>
    </main>

    <div id="scanner-modal">
        <div style="color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 20px; letter-spacing: 1px;">KOD TARA</div>
        <div id="reader"></div>
        <button onclick="closeScanner()" style="margin-top: 30px; padding: 15px 40px; background: #ff3333; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; letter-spacing: 1px;">İPTAL / KAPAT</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCX-X3ri95oQtO53tgEyAwqHuu1mmYKONM",
            authDomain: "terminux-wms.firebaseapp.com",
            projectId: "terminux-wms",
            storageBucket: "terminux-wms.firebasestorage.app",
            messagingSenderId: "427323493367",
            appId: "1:427323493367:web:8c0f7bdd21fe5b83c3bcf2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let catalogDb = {};
        window.mappingData = [];
        let html5QrCode = null;

        window.checkLogin = () => {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                alert('Hatalı parola!');
            }
        };

        document.getElementById('admin-pass').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') checkLogin();
        });

        const loadCatalog = async () => {
            try {
                const cachedData = localStorage.getItem('terminux_catalog_cache');
                if (cachedData) {
                    try {
                        const parsed = JSON.parse(cachedData);
                        if (Array.isArray(parsed)) {
                            parsed.forEach(item => {
                                const uKodu = String(item.urunKodu || item.docId || "");
                                catalogDb[uKodu] = { 
                                    urunKodu: uKodu, 
                                    urunAdi: String(item.urunAdi || "İsimsiz Ürün"), 
                                    barkod: String(item.barkod || ""), 
                                    refNo: String(item.refNo || "") 
                                };
                            });
                            return;
                        }
                    } catch(e) { }
                }

                const [anaSnap, amSnap] = await Promise.all([
                    getDocs(collection(db, "ana_depo")).catch(() => ({ forEach: () => {} })),
                    getDocs(collection(db, "ameliyathane")).catch(() => ({ forEach: () => {} }))
                ]);
                
                const processSnap = (snap) => {
                    if (!snap || typeof snap.forEach !== 'function') return;
                    snap.forEach(doc => {
                        const d = doc.data();
                        const key = String(d.urunKodu || doc.id || "");
                        if (!catalogDb[key]) {
                            catalogDb[key] = { 
                                urunKodu: key, 
                                urunAdi: String(d.urunAdi || "İsimsiz Ürün"), 
                                barkod: String(d.barkod || ""), 
                                refNo: String(d.refNo || "") 
                            };
                        }
                    });
                };
                
                processSnap(anaSnap); processSnap(amSnap);
            } catch (err) { }
        };

        loadCatalog();

        const validAddresses = [
            '05.01.01', '04.01.01',
            '07.01.05', '07.01.04', '07.01.03', '07.01.02', '07.01.01',
            '01.01.05', '01.01.04', '01.01.03', '01.01.02', '01.01.01',
            '01.02.05', '01.02.04', '01.02.03', '01.02.02', '01.02.01',
            '02.01.01', '02.01.02', '02.01.03', '02.01.04', '02.01.05',
            '03.01.01', '03.01.02', '03.01.03', '03.01.04', '03.01.05',
            '06.01.01', '06.01.02', '06.01.03', '06.01.04'
        ];

        validAddresses.sort(); 

        const selectEl = document.getElementById('p-address');
        validAddresses.forEach(addr => {
            const opt = document.createElement('option');
            opt.value = addr;
            opt.textContent = addr;
            selectEl.appendChild(opt);
        });

        const showToast = (msg = "Kayıt Başarılı!") => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        };

        const executeCodeMatch = (val) => {
            const codeInput = document.getElementById('p-code');
            const nameInput = document.getElementById('p-name');
            
            if (!val) {
                nameInput.value = '';
                codeInput.dataset.barkod = '';
                codeInput.dataset.refNo = '';
                return;
            }

            let matchedProduct = null;
            if (catalogDb[val]) {
                matchedProduct = catalogDb[val];
            } else {
                for (const key in catalogDb) {
                    if (catalogDb[key].barkod.toLowerCase() === val || catalogDb[key].refNo.toLowerCase() === val) {
                        matchedProduct = catalogDb[key];
                        break;
                    }
                }
            }

            if (matchedProduct) {
                nameInput.value = matchedProduct.urunAdi;
                codeInput.dataset.barkod = matchedProduct.barkod || "";
                codeInput.dataset.refNo = matchedProduct.refNo || "";
            } else {
                nameInput.value = '';
                codeInput.dataset.barkod = '';
                codeInput.dataset.refNo = '';
            }
        };

        document.getElementById('p-code').addEventListener('input', (e) => executeCodeMatch(e.target.value.trim().toLowerCase()));

        document.getElementById('mapping-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const codeEl = document.getElementById('p-code');
            let code = codeEl.value.trim();
            const name = document.getElementById('p-name').value.trim();
            const address = document.getElementById('p-address').value;
            const barkod = codeEl.dataset.barkod || "";
            const refNo = codeEl.dataset.refNo || "";

            const safeId = code.replace(/[^a-zA-Z0-9_-]/g, '-');

            try {
                await setDoc(doc(db, "kroki_adresleri", safeId), {
                    urunKodu: code,
                    urunAdi: name,
                    barkod: barkod,
                    refNo: refNo,
                    adres: address,
                    timestamp: Date.now()
                }, { merge: true });
                
                codeEl.value = '';
                codeEl.dataset.barkod = '';
                codeEl.dataset.refNo = '';
                document.getElementById('p-name').value = '';
                document.getElementById('p-address').value = '';
                codeEl.focus();
                showToast();
            } catch (error) {
                alert("Kayıt Hatası: " + error.message);
            }
        });

        // AKORDEON LİSTE YAPISI
        window.toggleAcc = (id) => {
            const body = document.getElementById(`acc-${id}`);
            body.style.display = body.style.display === 'none' ? 'block' : 'none';
        };

        onSnapshot(collection(db, "kroki_adresleri"), (snapshot) => {
            const listEl = document.getElementById('mapping-list');
            window.mappingData = [];
            snapshot.forEach(doc => window.mappingData.push({ id: doc.id, ...doc.data() }));

            if (window.mappingData.length === 0) {
                listEl.innerHTML = '<div style="padding:20px; text-align:center; color:#555; border: 1px solid #1a1a1a; border-radius: 8px;">Kayıtlı haritalandırma bulunamadı.</div>';
                return;
            }

            const grouped = {};
            window.mappingData.forEach(item => {
                if (!grouped[item.adres]) grouped[item.adres] = [];
                grouped[item.adres].push(item);
            });

            listEl.innerHTML = Object.keys(grouped).sort().map(addr => {
                const items = grouped[addr];
                let html = `
                <div class="accordion-item">
                    <div class="accordion-header" onclick="toggleAcc('${addr}')">
                        <span>📍 RAF ADRESİ: ${addr}</span>
                        <span>${items.length} Ürün ▼</span>
                    </div>
                    <div class="accordion-body" id="acc-${addr}">
                        ${items.map(item => `
                            <div class="accordion-row">
                                <div style="font-size: 12px; color: #888; font-family: monospace; width: 120px; text-align: left;">${item.urunKodu}</div>
                                <div style="font-size: 13px; color: #fff; flex: 1; text-align: left;">${item.urunAdi}</div>
                                <div style="display: flex; gap: 5px;">
                                    <button class="btn-action-sm" onclick="editMapping('${item.id}')">DÜZENLE</button>
                                    <button class="btn-action-sm btn-danger" onclick="deleteMapping('${item.id}')">SİL</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
                return html;
            }).join('');
        });

        window.editMapping = (id) => {
            const item = window.mappingData.find(m => m.id === id);
            if (item) {
                const codeEl = document.getElementById('p-code');
                codeEl.value = item.urunKodu;
                codeEl.dataset.barkod = item.barkod || "";
                codeEl.dataset.refNo = item.refNo || "";
                document.getElementById('p-name').value = item.urunAdi;
                document.getElementById('p-address').value = item.adres;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.deleteMapping = async (id) => {
            if (confirm("Bu haritalandırmayı silmek istediğinize emin misiniz?")) {
                try {
                    await deleteDoc(doc(db, "kroki_adresleri", id));
                } catch(e) {}
            }
        };

        // TÜMÜNÜ SİL FONKSİYONU
        window.deleteAllAddresses = () => {
            if(window.mappingData.length === 0) return alert("Silinecek kayıt bulunamadı.");
            
            if(confirm("DİKKAT: Veritabanındaki TÜM kroki adresleri kalıcı olarak silinecektir. Bu işlem geri alınamaz! Devam etmek istiyor musunuz?")) {
                const pwd = prompt("Güvenlik Onayı: Lütfen yönetici parolasını girin");
                if (pwd === "admin") {
                    showToast("Tüm adresler siliniyor, lütfen sayfayı kapatmayın...");
                    Promise.all(window.mappingData.map(item => deleteDoc(doc(db, "kroki_adresleri", item.id))))
                    .then(() => {
                        showToast("Veritabanı tamamen temizlendi!");
                    })
                    .catch(err => alert("Silme sırasında hata oluştu: " + err));
                } else {
                    alert("Parola hatalı! İşlem iptal edildi.");
                }
            }
        };

        window.triggerExcel = () => document.getElementById('excel-import').click();
        
        window.importExcel = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    
                    let added = 0; let updated = 0; let skipped = 0;

                    for (let r of rows) {
                        const code = r['Ürün Kodu'] || r['KOD'] || r['urunKodu'];
                        
                        // Ürün Adı sütünunu hatasız okumak için varyasyonları artırıldı
                        const name = r['Ürün Adı'] || r['Ürün İsmi'] || r['ÜRÜN ADI'] || r['urunAdi'] || r['İsim'] || r['Isim'];
                        
                        let addr = r['Adres'] || r['ADRES'] || r['adres'] || r['Stok Adresi'] || r['STOK ADRESİ'];
                        
                        if (code && addr) {
                            const safeCode = String(code).trim().replace(/[^a-zA-Z0-9_-]/g, '-');
                            
                            // BDA ön ekini silme filtresi
                            let cleanAddr = String(addr).trim().toUpperCase();
                            if (cleanAddr.startsWith('BDA')) {
                                cleanAddr = cleanAddr.substring(3).trim();
                            }

                            const existing = window.mappingData.find(m => m.id === safeCode);
                            
                            if (existing) {
                                if (existing.adres !== cleanAddr || existing.urunAdi !== String(name).trim()) {
                                    await setDoc(doc(db, "kroki_adresleri", safeCode), { urunKodu: String(code), urunAdi: String(name || "İsimsiz"), adres: cleanAddr, timestamp: Date.now() }, {merge: true});
                                    updated++;
                                } else {
                                    skipped++;
                                }
                            } else {
                                await setDoc(doc(db, "kroki_adresleri", safeCode), { urunKodu: String(code), urunAdi: String(name || "İsimsiz"), adres: cleanAddr, timestamp: Date.now() });
                                added++;
                            }
                        }
                    }
                    showToast(`İşlem Bitti! Eklenen: ${added} | Güncellenen: ${updated} | Atlanan: ${skipped}`);
                } catch(err) {
                    alert("Excel okunurken hata oluştu: " + err.message);
                }
                e.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        };

        window.exportExcel = () => {
            if (window.mappingData.length === 0) return alert("Dışa aktarılacak kayıt yok.");
            const data = window.mappingData.map(m => ({ "Ürün Kodu": m.urunKodu, "Ürün İsmi": m.urunAdi, "Adres": m.adres }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "ADRESLER");
            XLSX.writeFile(wb, `Terminux_DepoAdresleri.xlsx`);
        };

        // BARKOD TARAMA (Admin)
        window.openScanner = () => {
            document.getElementById('scanner-modal').style.display = 'flex';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    const inputEl = document.getElementById('p-code');
                    inputEl.value = decodedText;
                    executeCodeMatch(decodedText.trim().toLowerCase());
                    closeScanner();
                },
                (errorMessage) => {}
            ).catch((err) => {
                alert("Kamera başlatılamadı. Lütfen tarayıcı izinlerini kontrol edin.");
                closeScanner();
            });
        };

        window.closeScanner = () => {
            document.getElementById('scanner-modal').style.display = 'none';
            if(html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
            }
        };

    </script>
</body>
</html>
