<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminux | Kroki Adres Yönetimi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="harita-am.js"></script>
    <script src="harita-ana.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body, html { background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { padding: 20px 40px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; background: #050505; flex-shrink: 0; z-index: 100; }
        .header-title { font-weight: 800; font-size: 24px; letter-spacing: -1px; color: #fff; }
        .header-subtitle { color: #ffbc00; font-size: 14px; font-weight: 600; letter-spacing: 2px; }
        .btn-secondary { background: #111; color: #fff; border: 1px solid #333; padding: 10px 15px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; text-align: center; display: inline-block; text-decoration: none; }
        .btn-secondary:hover { background: #222; border-color: #555; }
        
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #000; position: relative; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #080808; border-bottom: 1px solid #1a1a1a; gap: 15px; flex-wrap: wrap; }
        
        .depo-tabs { display: flex; gap: 8px; }
        .depo-btn { padding: 10px 15px; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; letter-spacing: 1px; transition: 0.2s; border: none; }
        .depo-btn.active { background: #00ccff; color: #000; }
        .depo-btn.inactive { background: #111; color: #666; border: 1px solid #333; }
        
        .action-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn-action { background: #ffbc00; color: #000; border: none; padding: 10px 15px; font-size: 11px; font-weight: 800; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: #e0a800; }
        .btn-excel-out { background: #00ccff; color: #000; }
        .btn-excel-in { background: #00ff00; color: #000; }

        .zoom-group { display: flex; align-items: center; background: #111; border: 1px solid #333; border-radius: 6px; padding: 2px; }
        .zoom-btn { background: transparent; border: none; color: #fff; font-size: 18px; font-weight: bold; width: 35px; cursor: pointer; }
        .zoom-val { font-size: 12px; font-weight: bold; font-family: monospace; width: 50px; text-align: center; color: #00ccff; }

        .map-outer { flex: 1; overflow: auto; padding: 20px; background: #050505; display: flex; align-items: center; justify-content: center; }
        .map-container { position: relative; transition: width 0.2s, height 0.2s; margin: auto; }
        .map-wrapper { width: 100%; aspect-ratio: 16/9; position: relative; background: #050505; border: 1px solid #1a1a1a; border-radius: 12px; overflow: hidden; transform-origin: top left; transition: transform 0.2s; }
        
        .map-wrapper-am { min-width: 900px; }
        .map-wrapper-ana { min-width: 1100px; }

        .cell { background: #0a0a0a; border: 1px solid #222; display: flex; align-items: center; justify-content: center; color: #888; font-family: monospace; font-size: clamp(5px, 1.2vw, 11px); font-weight: bold; transition: 0.3s; border-radius: 3px; text-align: center; overflow: hidden; position: relative; cursor: pointer; pointer-events: auto !important; }
        .cell-lens { border: 2px solid #333; font-size: clamp(6px, 1.4vw, 12px); }
        .cell-hidden { visibility: hidden; }
        .cell:hover { background: #ffbc00; color: #000; border-color: #fff; box-shadow: 0 0 15px rgba(255,188,0,0.5); z-index: 10; font-size: 14px; }
        .map-inner-door { border: 2px dashed #888; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-weight: bold; font-size: 10px; z-index: 10; pointer-events: none; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px); padding: 20px; }
        .modal-box { background: #0c0c0c; border: 1px solid #333; border-radius: 12px; padding: 30px; width: 100%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.9); overflow-y: auto; }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 1px; }
        .modal-title span { color: #ffbc00; font-family: monospace; }
        .btn-close { background: transparent; border: none; color: #888; font-size: 24px; cursor: pointer; line-height: 1; }
        .btn-close:hover { color: #ff3333; }

        .product-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .product-card { background: #111; border: 1px solid #222; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .product-card:hover { border-color: #444; }
        .pc-info { display: flex; flex-direction: column; gap: 4px; }
        .pc-name { font-size: 14px; font-weight: bold; color: #fff; }
        .pc-code { font-size: 11px; color: #aaa; font-family: monospace; }
        .pc-actions { display: flex; gap: 8px; }
        .btn-edit { background: #00ccff; color: #000; border: none; padding: 6px 12px; font-size: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-del { background: #ff3333; color: #fff; border: none; padding: 6px 12px; font-size: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 11px; color: #888; font-weight: bold; letter-spacing: 1px; }
        .form-group input { background: #000; border: 1px solid #333; color: #00ff00; padding: 12px; font-family: monospace; font-size: 14px; border-radius: 6px; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: #ffbc00; }
        
        .btn-save { background: #00ff00; color: #000; border: none; padding: 15px; font-weight: 900; font-size: 14px; border-radius: 6px; cursor: pointer; letter-spacing: 2px; width: 100%; transition: 0.2s; }
        .btn-save:hover { opacity: 0.8; }

        .legal-footer { padding: 8px 15px; font-size: 10px; color: #666; text-align: center; border-top: 1px solid #1a1a1a; background: #050505; flex-shrink: 0; }

        #password-modal { display: flex; position: fixed; z-index: 50000; top: 0; left: 0; width: 100%; height: 100%; background: #000; align-items: center; justify-content: center; }
        .pw-box { background: #0a0a0a; border: 1px solid #222; padding: 40px; border-radius: 12px; text-align: center; width: 100%; max-width: 350px; }
        .pw-box input { width: 100%; background: #000; border: 1px solid #444; color: #ffbc00; padding: 15px; font-size: 24px; border-radius: 6px; text-align: center; margin-bottom: 20px; outline: none; letter-spacing: 8px; font-family: monospace; }
        .pw-box button { width: 100%; background: #ffbc00; color: #000; border: none; padding: 15px; border-radius: 6px; font-weight: 900; cursor: pointer; letter-spacing: 2px; }

        @media (max-width: 900px) {
            header { flex-direction: column; padding: 15px 20px; gap: 15px; text-align: center; }
            .toolbar { flex-direction: column; padding: 15px; align-items: stretch; }
            .action-group { flex-direction: column; align-items: stretch; }
            .legal-footer { font-size: 7px; padding: 5px; }
        }
    </style>
</head>
<body>

    <div id="password-modal">
        <div class="pw-box">
            <h3 style="margin-top: 0; color: #fff; margin-bottom: 20px; font-size: 16px; letter-spacing: 1px;">YÖNETİM ŞİFRESİ</h3>
            <input type="password" id="admin-pw-input" autocomplete="new-password">
            <button onclick="submitPassword()">SİSTEME GİRİŞ YAP</button>
        </div>
    </div>

    <header>
        <div class="header-title">TERMINUX <span class="header-subtitle">ADRES YÖNETİMİ</span></div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <a href="index.html" class="btn-secondary" style="border-color: rgba(255,255,255,0.3);">WMS GEÇİŞ</a>
            <a href="adres.html" class="btn-secondary" style="border-color: #ff3333; color: #ff3333;">ADRES BULUCU</a>
        </div>
    </header>

    <div class="toolbar">
        <div class="depo-tabs">
            <button class="depo-btn active" id="tab-am" onclick="switchDepo('am')">AMELİYATHANE</button>
            <button class="depo-btn inactive" id="tab-ana" onclick="switchDepo('ana')">ANA DEPO</button>
        </div>
        
        <div class="zoom-group">
            <button class="zoom-btn" onclick="changeZoom(-0.25)">-</button>
            <div class="zoom-val" id="zoom-val">%100</div>
            <button class="zoom-btn" onclick="changeZoom(0.25)">+</button>
        </div>

        <div class="action-group">
            <button class="btn-action" onclick="openProductModal()">+ SIFIRDAN ÜRÜN EKLE</button>
            <input type="file" id="import-file" accept=".xlsx, .xls" style="display:none;" onchange="importExcel(event)">
            <button class="btn-action btn-excel-in" id="btn-excel-upload" onclick="document.getElementById('import-file').click()">EXCEL İLE YÜKLE</button>
            <button class="btn-action btn-excel-out" id="btn-excel-download" onclick="exportExcel()">YEDEĞİ İNDİR (EXCEL)</button>
        </div>
    </div>

    <main>
        <div class="map-outer" id="map-outer">
            <div class="map-container" id="map-container">
                <div id="admin-map-area" class="map-wrapper"></div>
            </div>
        </div>
    </main>

    <div class="legal-footer">
        YASAL BİLGİLENDİRME: Kapalı devre operasyonel test sistemidir. Ticari faaliyet bulunmamaktadır.
    </div>

    <div id="cell-modal" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title">RAF İÇERİĞİ: <span id="cell-modal-title">00.00.00</span></div>
                <div>
                    <button class="btn-edit" style="margin-right: 10px;" onclick="changeCellAddress()">ADRESİ DEĞİŞTİR / TAŞI</button>
                    <button class="btn-close" onclick="closeModal('cell-modal')">×</button>
                </div>
            </div>
            
            <div id="cell-loading" style="text-align:center; color:#888; padding: 20px; font-family:monospace; display:none;">Veriler getiriliyor...</div>
            <div id="cell-empty" style="text-align:center; color:#ff3333; padding: 20px; font-weight:bold; display:none;">Bu adreste kayıtlı ürün bulunamadı.</div>
            
            <div class="product-list" id="cell-product-list"></div>
            
            <button class="btn-action" style="width:100%; padding:15px; font-size:13px;" onclick="openProductModal(document.getElementById('cell-modal-title').innerText)">BU RAFA YENİ ÜRÜN EKLE</button>
        </div>
    </div>

    <div id="product-modal" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="pm-title">YENİ ÜRÜN EKLE</div>
                <button class="btn-close" onclick="closeModal('product-modal')">×</button>
            </div>
            
            <input type="hidden" id="pm-id">
            
            <div class="form-group">
                <label>ADRES (Zorunlu)</label>
                <input type="text" id="pm-adres" placeholder="Örn: 05.01.01">
            </div>
            <div class="form-group">
                <label>ÜRÜN ADI</label>
                <input type="text" id="pm-isim" placeholder="Ürün İsmi">
            </div>
            <div class="form-group">
                <label>ÜRÜN KODU</label>
                <input type="text" id="pm-kodu" placeholder="Kodu">
            </div>
            <div class="form-group">
                <label>BARKOD</label>
                <input type="text" id="pm-barkod" placeholder="Barkodu">
            </div>
            <div class="form-group">
                <label>REFERANS NO</label>
                <input type="text" id="pm-ref" placeholder="Ref No">
            </div>

            <button class="btn-save" id="btn-save-product" onclick="saveProduct()">KAYDET</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, addDoc, updateDoc, deleteDoc, query, where, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCX-X3ri95oQtO53tgEyAwqHuu1mmYKONM",
            authDomain: "terminux-wms.firebaseapp.com",
            projectId: "terminux-wms",
            storageBucket: "terminux-wms.firebasestorage.app",
            messagingSenderId: "427323493367",
            appId: "1:427323493367:web:8c0f7bdd21fe5b83c3bcf2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentDepo = 'am';
        let currentCollection = 'kroki_adresleri';
        let currentScale = 1.0;

        window.submitPassword = () => {
            const pw = document.getElementById('admin-pw-input').value;
            if(pw === 'admin') {
                document.getElementById('password-modal').style.display = 'none';
                switchDepo('am');
            } else {
                alert("Hatalı şifre!");
                document.getElementById('admin-pw-input').value = '';
            }
        };

        document.getElementById('admin-pw-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') submitPassword();
        });

        window.switchDepo = (depo) => {
            currentDepo = depo;
            const mapArea = document.getElementById('admin-map-area');

            if(depo === 'am') {
                document.getElementById('tab-am').classList.replace('inactive', 'active');
                document.getElementById('tab-ana').classList.replace('active', 'inactive');
                currentCollection = 'kroki_adresleri';
                mapArea.className = 'map-wrapper map-wrapper-am';
                mapArea.innerHTML = window.haritaAmeliyathane || "";
                
                document.getElementById('btn-excel-upload').innerText = 'AMELİYATHANE İÇİN EXCEL YÜKLE';
                document.getElementById('btn-excel-download').innerText = 'AMELİYATHANE YEDEĞİ İNDİR';
            } else {
                document.getElementById('tab-ana').classList.replace('inactive', 'active');
                document.getElementById('tab-am').classList.replace('active', 'inactive');
                currentCollection = 'kroki_adresleri_ana';
                mapArea.className = 'map-wrapper map-wrapper-ana';
                mapArea.innerHTML = window.haritaAnaDepo || "";
                
                document.getElementById('btn-excel-upload').innerText = 'ANA DEPO İÇİN EXCEL YÜKLE';
                document.getElementById('btn-excel-download').innerText = 'ANA DEPO YEDEĞİ İNDİR';
            }
            
            const svgEl = mapArea.querySelector('svg');
            if(svgEl) svgEl.style.display = 'none';
            mapArea.querySelectorAll('.map-pathway').forEach(p => p.style.display = 'none');
            
            setTimeout(() => {
                mapArea.querySelectorAll('.cell').forEach(cell => {
                    if(cell.classList.contains('cell-hidden') || !cell.id || cell.id.trim() === '') {
                        cell.style.visibility = 'visible';
                        cell.style.opacity = '0.3';
                        cell.innerText = '+';
                        cell.classList.remove('cell-hidden');
                    }
                    cell.style.pointerEvents = 'auto';

                    const newCell = cell.cloneNode(true);
                    cell.parentNode.replaceChild(newCell, cell);
                    
                    newCell.addEventListener('click', () => {
                        let addr = newCell.id ? newCell.id.replace('cell-', '') : '';
                        if(!addr || addr === '' || addr === 'undefined') {
                            if(confirm("Bu rafa / bloğa toplu adres tanımlamak ister misiniz?\n\nTamam = Toplu Tanımla\nİptal = Sadece bu hücreye tanımla")) {
                                let parentGrid = newCell.parentElement;
                                let cellsInGrid = Array.from(parentGrid.querySelectorAll('.cell'));
                                
                                let prefix = prompt("Adres Ön Eki (örn: A1- veya 06.01.):");
                                if(!prefix) return;
                                let startNum = parseInt(prompt("Başlangıç Numarası (örn: 1):", "1"));
                                if(isNaN(startNum)) return;
                                let count = parseInt(prompt(`Kaç adet adres tanımlanacak? (Bu raftaki hücre kapasitesi: ${cellsInGrid.length})`, cellsInGrid.length));
                                if(isNaN(count)) return;
                                let rot = prompt("Yazı Yönü Açısı (0, 90, -90 vb.):", "0");

                                for(let i=0; i<count; i++) {
                                    if(i < cellsInGrid.length) {
                                        let targetCell = cellsInGrid[i];
                                        let numStr = (startNum + i).toString().padStart(2, '0');
                                        let sep = prefix.endsWith('.') || prefix.endsWith('-') ? '' : '.';
                                        let fullAddr = prefix + sep + numStr;

                                        targetCell.id = 'cell-' + fullAddr;
                                        targetCell.innerHTML = `<span style="display:inline-block; transform: rotate(${rot}deg); white-space: nowrap; pointer-events: none;">${fullAddr}</span>`;
                                        targetCell.style.opacity = '1';
                                        targetCell.classList.remove('cell-hidden');
                                        
                                        targetCell.onclick = () => { openCellModal(fullAddr); };
                                    }
                                }
                                alert("Adresler tanımlandı! Değişikliklerin kalıcı olması için kod üret adımını unutmayın (Tasarlayıcıda). NOT: Bu ekran sadece geçici bir görünüm sağlar.");
                                return;
                            } else {
                                addr = prompt("Yeni adres (örn: A1-01):");
                                if(!addr) return;
                                newCell.id = 'cell-' + addr;
                                newCell.innerText = addr;
                                newCell.style.opacity = '1';
                                newCell.classList.remove('cell-hidden');
                            }
                        }
                        openCellModal(addr);
                    });
                });
            }, 300);

            applyZoom();
        };

        window.changeZoom = (delta) => {
            currentScale += delta;
            if(currentScale < 0.25) currentScale = 0.25;
            if(currentScale > 2.5) currentScale = 2.5;
            document.getElementById('zoom-val').innerText = '%' + Math.round(currentScale * 100);
            applyZoom();
        };

        function applyZoom() {
            const mapWrapper = document.getElementById('admin-map-area');
            const mapContainer = document.getElementById('map-container');
            
            mapWrapper.style.transform = `scale(${currentScale})`;
            
            const baseW = currentDepo === 'am' ? 950 : 1200;
            const baseH = (baseW * 9) / 16; 
            
            mapContainer.style.width = (baseW * currentScale) + 'px';
            mapContainer.style.height = (baseH * currentScale) + 'px';
        }

        window.closeModal = (id) => {
            document.getElementById(id).style.display = 'none';
        };

        window.openCellModal = async (adres) => {
            document.getElementById('cell-modal-title').innerText = adres;
            document.getElementById('cell-modal').style.display = 'flex';
            document.getElementById('cell-loading').style.display = 'block';
            document.getElementById('cell-empty').style.display = 'none';
            document.getElementById('cell-product-list').innerHTML = '';

            try {
                const q = query(collection(db, currentCollection), where("adres", "==", adres));
                const querySnapshot = await getDocs(q);
                
                document.getElementById('cell-loading').style.display = 'none';
                
                if (querySnapshot.empty) {
                    document.getElementById('cell-empty').style.display = 'block';
                } else {
                    let html = '';
                    querySnapshot.forEach((docSnap) => {
                        const d = docSnap.data();
                        html += `
                            <div class="product-card" id="card-${docSnap.id}">
                                <div class="pc-info">
                                    <div class="pc-name">${d.urunAdi || '-'}</div>
                                    <div class="pc-code">KOD: ${d.urunKodu || '-'} | BARKOD: ${d.barkod || '-'}</div>
                                </div>
                                <div class="pc-actions">
                                    <button class="btn-edit" onclick="editProduct('${docSnap.id}', '${(d.urunAdi || '').replace(/'/g, "\\'")}', '${d.urunKodu || ''}', '${d.barkod || ''}', '${d.refNo || ''}', '${d.adres}')">DÜZENLE</button>
                                    <button class="btn-del" onclick="deleteProduct('${docSnap.id}')">SİL</button>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('cell-product-list').innerHTML = html;
                }
            } catch(e) {
                alert("Veriler çekilirken hata: " + e.message);
                document.getElementById('cell-loading').style.display = 'none';
            }
        };

        window.openProductModal = (prefillAdres = "") => {
            document.getElementById('pm-id').value = '';
            document.getElementById('pm-adres').value = prefillAdres;
            document.getElementById('pm-isim').value = '';
            document.getElementById('pm-kodu').value = '';
            document.getElementById('pm-barkod').value = '';
            document.getElementById('pm-ref').value = '';
            
            document.getElementById('pm-title').innerText = prefillAdres ? "BU RAFA ÜRÜN EKLE" : "SIFIRDAN ÜRÜN EKLE";
            document.getElementById('btn-save-product').innerText = "KAYDET VE EKLE";
            document.getElementById('product-modal').style.display = 'flex';
        };

        window.editProduct = (id, isim, kod, barkod, ref, adres) => {
            document.getElementById('pm-id').value = id;
            document.getElementById('pm-adres').value = adres;
            document.getElementById('pm-isim').value = isim;
            document.getElementById('pm-kodu').value = kod;
            document.getElementById('pm-barkod').value = barkod;
            document.getElementById('pm-ref').value = ref;
            
            document.getElementById('pm-title').innerText = "ÜRÜNÜ DÜZENLE";
            document.getElementById('btn-save-product').innerText = "GÜNCELLE";
            document.getElementById('product-modal').style.display = 'flex';
        };

        window.saveProduct = async () => {
            const id = document.getElementById('pm-id').value;
            const adres = document.getElementById('pm-adres').value.trim();
            const btn = document.getElementById('btn-save-product');
            
            if(!adres) { alert("Lütfen ürünün adresini girin!"); return; }

            btn.innerText = "KAYDEDİLİYOR...";
            btn.disabled = true;

            const dataObj = {
                adres: adres,
                urunAdi: document.getElementById('pm-isim').value.trim(),
                urunKodu: document.getElementById('pm-kodu').value.trim(),
                barkod: document.getElementById('pm-barkod').value.trim(),
                refNo: document.getElementById('pm-ref').value.trim()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, currentCollection, id), dataObj);
                    alert("Ürün başarıyla güncellendi.");
                } else {
                    await addDoc(collection(db, currentCollection), dataObj);
                    alert("Yeni ürün başarıyla eklendi.");
                }
                closeModal('product-modal');
                if(document.getElementById('cell-modal').style.display === 'flex') {
                    openCellModal(document.getElementById('cell-modal-title').innerText);
                }
            } catch(e) {
                alert("Kaydetme hatası: " + e.message);
            }
            btn.disabled = false;
        };

        window.deleteProduct = async (id) => {
            if(!confirm("Bu ürünü silmek istediğinize emin misiniz?")) return;
            try {
                document.getElementById(`card-${id}`).style.opacity = '0.3';
                await deleteDoc(doc(db, currentCollection, id));
                document.getElementById(`card-${id}`).remove();
                
                if(document.getElementById('cell-product-list').innerHTML.trim() === '') {
                    document.getElementById('cell-empty').style.display = 'block';
                }
            } catch(e) {
                alert("Silme hatası: " + e.message);
            }
        };

        window.changeCellAddress = async () => {
            const oldAdres = document.getElementById('cell-modal-title').innerText;
            const newAdres = prompt(`'${oldAdres}' adresini hangi yeni adres ile değiştirmek istiyorsunuz?\n(İçindeki tüm ürünler de yeni adrese taşınacaktır.)`);
            if(!newAdres || newAdres.trim() === '' || newAdres === oldAdres) return;
            
            if(!confirm(`Emin misiniz? '${oldAdres}' adresindeki tüm ürünler '${newAdres}' olarak güncellenecek.`)) return;

            try {
                document.getElementById('cell-loading').style.display = 'block';
                document.getElementById('cell-product-list').style.display = 'none';

                const q = query(collection(db, currentCollection), where("adres", "==", oldAdres));
                const snapshot = await getDocs(q);
                
                let promises = [];
                snapshot.forEach(docSnap => {
                    promises.push(updateDoc(doc(db, currentCollection, docSnap.id), { adres: newAdres }));
                });
                
                await Promise.all(promises);
                
                alert("Adres başarıyla güncellendi ve ürünler taşındı!");
                closeModal('cell-modal');
                
                let cell = document.getElementById('cell-' + oldAdres);
                if(cell) {
                    cell.id = 'cell-' + newAdres;
                    cell.innerText = newAdres;
                }
            } catch(err) {
                alert("Adres güncelleme hatası: " + err.message);
            }
        };

        window.exportExcel = async () => {
            const q = query(collection(db, currentCollection));
            const snapshot = await getDocs(q);
            let data = [];
            snapshot.forEach(doc => {
                let d = doc.data();
                data.push({
                    "Adres": d.adres || "",
                    "Ürün Adı": d.urunAdi || "",
                    "Ürün Kodu": d.urunKodu || "",
                    "Barkod": d.barkod || "",
                    "Ref No": d.refNo || ""
                });
            });
            
            if(data.length === 0) { alert("Dışa aktarılacak veri yok."); return; }
            
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Adresler");
            XLSX.writeFile(wb, `terminux_${currentDepo}_yedek.xlsx`);
        };

        window.importExcel = (event) => {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet);
                    
                    if(!confirm(`${currentDepo === 'am' ? 'AMELİYATHANE' : 'ANA DEPO'} için ${rows.length} adet ürün sisteme eklenecek. Onaylıyor musunuz?`)) return;
                    
                    document.getElementById('import-file').value = '';
                    
                    let count = 0;
                    for(let row of rows) {
                        let adres = row["Adres"] || row["adres"] || "";
                        if(adres) {
                            await addDoc(collection(db, currentCollection), {
                                adres: String(adres),
                                urunAdi: String(row["Ürün Adı"] || row["urunAdi"] || ""),
                                urunKodu: String(row["Ürün Kodu"] || row["urunKodu"] || ""),
                                barkod: String(row["Barkod"] || row["barkod"] || ""),
                                refNo: String(row["Ref No"] || row["refNo"] || "")
                            });
                            count++;
                        }
                    }
                    alert(`${count} adet ürün başarıyla yüklendi! Lütfen kotayı aşmamak için sayfanın güncellenmesini bekleyin.`);
                    switchDepo(currentDepo);
                } catch(err) {
                    alert("Excel yükleme hatası: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        };

    </script>
</body>
</html>
