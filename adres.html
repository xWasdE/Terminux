<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminux | Depo Adres Bulucu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="harita-am.js"></script>
    <script src="harita-ana.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body, html { background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { padding: 20px 40px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; background: #050505; flex-shrink: 0; }
        .header-title { font-weight: 800; font-size: 24px; letter-spacing: -1px; color: #fff; }
        .header-subtitle { color: #ff3333; font-size: 14px; font-weight: 600; letter-spacing: 2px; }
        .btn-secondary { background: #111; color: #fff; border: 1px solid #333; padding: 10px 15px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; text-align: center; display: inline-block; text-decoration: none; }
        .btn-secondary:hover { background: #222; border-color: #555; }
        
        main { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; background: #000; }

        .toolbar { display: flex; gap: 15px; width: 100%; max-width: 1000px; margin-bottom: 15px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .depo-tabs { display: flex; gap: 8px; background: #080808; padding: 6px; border-radius: 8px; border: 1px solid #1a1a1a; flex-shrink: 0; }
        .depo-btn { padding: 8px 12px; border-radius: 6px; font-weight: 800; font-size: 10px; cursor: pointer; letter-spacing: 1px; transition: 0.2s; border: none; }
        .depo-btn.active { background: #00ccff; color: #000; }
        .depo-btn.inactive { background: #111; color: #666; border: 1px solid #333; }
        .depo-btn.inactive:hover { border-color: #ffbc00; color: #ffbc00; }

        .zoom-group { display: flex; align-items: center; background: #111; border: 1px solid #333; border-radius: 6px; padding: 2px; height: 35px; }
        .zoom-btn { background: transparent; border: none; color: #fff; font-size: 18px; font-weight: bold; width: 35px; cursor: pointer; }
        .zoom-val { font-size: 12px; font-weight: bold; font-family: monospace; width: 50px; text-align: center; color: #00ccff; }

        .search-container { width: 100%; max-width: 1000px; margin-bottom: 15px; position: relative; }
        .search-wrapper { display: flex; gap: 10px; width: 100%; }
        .search-input { flex: 1; background: #0a0a0a; border: 2px solid #333; color: #fff; padding: 18px; font-size: 16px; border-radius: 8px; outline: none; transition: 0.2s; font-family: monospace; text-align: center; width: 100%; }
        .search-input:focus { border-color: #ff3333; }
        .btn-scan { background: #222; border: 2px solid #444; color: #fff; padding: 0 25px; font-size: 14px; font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap; letter-spacing: 1px; }
        .btn-scan:hover { border-color: #ff3333; color: #ff3333; }
        .clear-icon { position: absolute; right: 170px; top: 18px; background: #ff3333; color: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; display: none; z-index: 10; letter-spacing: 1px; transition: 0.2s; }
        .clear-icon:hover { background: #cc0000; }

        .result-banner { display: none; width: 100%; max-width: 1000px; background: rgba(255,51,51,0.1); border: 1px solid #ff3333; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; animation: fadeIn 0.3s ease; }
        .result-title { font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .result-name { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 5px; }
        .result-address { font-size: 30px; font-weight: 900; color: #ff3333; font-family: monospace; letter-spacing: 2px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #0a0a0a; border: 1px solid #333; z-index: 1000; max-height: 300px; overflow-y: auto; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin-top: 5px; }
        .dropdown-item { padding: 15px 20px; border-bottom: 1px solid #1a1a1a; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .dropdown-item:hover { background: #111; border-color: #ff3333; border-left: 4px solid #ff3333; }
        .di-name { color: #fff; font-size: 13px; font-weight: 600; }
        .di-code { color: #888; font-size: 11px; font-family: monospace; }

        .map-scroll-container { width: 100%; max-width: 1200px; margin-bottom: 50px; display: flex; justify-content: center; overflow-x: auto; }
        .map-container { position: relative; transition: width 0.2s, height 0.2s; margin: auto; flex-shrink: 0; }
        .map-wrapper { width: 100%; aspect-ratio: 16/9; position: relative; background: #050505; border: 4px solid #1a1a1a; border-radius: 12px; margin: 0 auto; transform-origin: top left; transition: transform 0.2s; }
        
        .map-wrapper-am { min-width: 900px; }
        .map-wrapper-ana { min-width: 1100px; }

        .cell { background: #0a0a0a; border: 1px solid #222; display: flex; align-items: center; justify-content: center; color: #666; font-family: monospace; font-size: 11px; font-weight: bold; transition: 0.3s; border-radius: 3px; text-align: center; }
        .cell-lens { border: 2px solid #333; font-size: 12px; }
        .cell-hidden { visibility: hidden; pointer-events: none; }

        .cell.active { 
            animation: flashRed 0.8s infinite alternate; 
            background: #ff0000 !important; 
            color: #fff !important; 
            font-weight: 900 !important; 
            font-size: 14px !important; 
            box-shadow: 0 0 20px #ff0000 !important; 
            z-index: 10; 
            position: relative; 
            border-color: #ffaa00 !important;
        }

        @keyframes flashRed {
            from { background: rgba(255,0,0,0.6); box-shadow: 0 0 10px red; transform: scale(1); }
            to { background: rgba(255,0,0,1); box-shadow: 0 0 30px red; transform: scale(1.1); }
        }

        .path-animation { stroke-dasharray: 10; animation: dash 0.5s linear infinite reverse; }
        @keyframes dash { to { stroke-dashoffset: 20; } }

        #scanner-modal { display:none; position:fixed; z-index:20000; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(5px); }
        #reader { width: 100%; max-width: 400px; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #333; }
        
        .custom-alert { display:none; position:fixed; z-index:25000; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(5px); padding: 20px; }
        .modal-box { background: #0c0c0c; border: 1px solid #333; padding: 40px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); text-align: center; }

        .legal-footer { position: fixed; bottom: 0; left: 0; right: 0; width: 100vw; background-color: rgba(5, 5, 5, 0.95); color: #888; text-align: center; padding: 8px 15px; font-size: 10px; z-index: 9999; border-top: 1px solid #1a1a1a; backdrop-filter: blur(8px); line-height: 1.4; box-sizing: border-box; overflow-wrap: break-word; }

        @media (max-width: 900px) {
            header { flex-direction: column; padding: 15px 20px; gap: 10px; text-align: center; }
            .header-title { font-size: 20px; }
            main { padding: 15px; }
            .search-wrapper { flex-direction: column; }
            .btn-scan { height: 45px; padding: 0; width: 100%; }
            .clear-icon { right: 10px; top: 15px; }
            .map-scroll-container { justify-content: flex-start; padding-bottom: 15px; }
            
            .cell { font-size: 0 !important; color: transparent !important; border-width: 1px; }
            .cell.active { font-size: 0 !important; border-width: 2px; }
            .map-desk-sub { display: none; }
            .legal-footer { font-size: 7px; padding: 5px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">TERMINUX <span class="header-subtitle">DEPO ADRES BULUCU</span></div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <a href="index.html" class="btn-secondary" style="border-color: rgba(255,255,255,0.3);">WMS GEÇİŞ</a>
            <a href="adresadmin.html" class="btn-secondary" style="border-color: #ffbc00; color: #ffbc00;">YÖNETİM</a>
        </div>
    </header>

    <main id="main-content-scroll">
        <div class="toolbar">
            <div class="depo-tabs">
                <button class="depo-btn active" id="tab-am" onclick="switchDepo('am')">AMELİYATHANE DEPOSU</button>
                <button class="depo-btn inactive" id="tab-ana" onclick="switchDepo('ana')">ANA DEPO</button>
            </div>
            <div class="zoom-group">
                <button class="zoom-btn" onclick="changeZoom(-0.25)">-</button>
                <div class="zoom-val" id="zoom-val">%100</div>
                <button class="zoom-btn" onclick="changeZoom(0.25)">+</button>
            </div>
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <input type="text" id="search-input" class="search-input" placeholder="Ürün Adı, Barkod veya Kod ile arayın..." autocomplete="off">
                <span class="clear-icon" id="clear-search" onclick="clearSearch()">✕ TEMİZLE</span>
                <button class="btn-scan" onclick="openScanner()">BARKOD TARA</button>
            </div>
            <div id="search-dropdown" class="dropdown"></div>
        </div>

        <div id="result-banner" class="result-banner">
            <div class="result-title">EŞLEŞEN ÜRÜN BULUNDU</div>
            <div id="result-name" class="result-name">-</div>
            <div id="result-address" class="result-address">-</div>
        </div>

        <div class="map-scroll-container">
            <div class="map-container" id="map-container">
                <div id="map-area" class="map-wrapper"></div>
            </div>
        </div>
    </main>

    <div class="legal-footer">
        YASAL BİLGİLENDİRME: Kapalı devre operasyonel test sistemidir. Ticari faaliyet bulunmamaktadır.
    </div>

    <div id="scanner-modal">
        <div style="color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 20px; letter-spacing: 1px;">KOD TARA</div>
        <div id="reader"></div>
        <button onclick="closeScanner()" style="margin-top: 30px; padding: 15px 40px; background: #ff3333; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; letter-spacing: 1px;">İPTAL / KAPAT</button>
    </div>

    <div id="custom-alert" class="custom-alert">
        <div class="modal-box">
            <div style="font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 15px; letter-spacing: 1px;">UYARI</div>
            <div id="alert-desc" style="font-size: 13px; color: #aaa; line-height: 1.5; margin-bottom: 30px;">-</div>
            <button onclick="closeAlert()" style="background: #ff3333; color: #fff; border: none; padding: 15px 30px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 14px;">TAMAM</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCX-X3ri95oQtO53tgEyAwqHuu1mmYKONM",
            authDomain: "terminux-wms.firebaseapp.com",
            projectId: "terminux-wms",
            storageBucket: "terminux-wms.firebasestorage.app",
            messagingSenderId: "427323493367",
            appId: "1:427323493367:web:8c0f7bdd21fe5b83c3bcf2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let mappingData = [];
        let searchTimeout = null;
        let html5QrCode = null;

        let currentDepo = 'am';
        let currentCollection = 'kroki_adresleri';
        let currentScale = 1.0;

        const inputEl = document.getElementById('search-input');
        const clearIcon = document.getElementById('clear-search');
        const dropdownEl = document.getElementById('search-dropdown');
        const bannerEl = document.getElementById('result-banner');
        const nameEl = document.getElementById('result-name');
        const addressEl = document.getElementById('result-address');

        window.switchDepo = (depo) => {
            currentDepo = depo;
            const mapArea = document.getElementById('map-area');

            if(depo === 'am') {
                document.getElementById('tab-am').classList.replace('inactive', 'active');
                document.getElementById('tab-ana').classList.replace('active', 'inactive');
                currentCollection = 'kroki_adresleri';
                mapArea.className = 'map-wrapper map-wrapper-am';
                mapArea.innerHTML = window.haritaAmeliyathane || "";
            } else {
                document.getElementById('tab-ana').classList.replace('inactive', 'active');
                document.getElementById('tab-am').classList.replace('active', 'inactive');
                currentCollection = 'kroki_adresleri_ana';
                mapArea.className = 'map-wrapper map-wrapper-ana';
                mapArea.innerHTML = window.haritaAnaDepo || "";
            }
            clearSearch();
            loadMappingData();
            applyZoom();
        }

        window.changeZoom = (delta) => {
            currentScale += delta;
            if(currentScale < 0.25) currentScale = 0.25;
            if(currentScale > 2.5) currentScale = 2.5;
            document.getElementById('zoom-val').innerText = '%' + Math.round(currentScale * 100);
            applyZoom();
        };

        function applyZoom() {
            const mapWrapper = document.getElementById('map-area');
            const mapContainer = document.getElementById('map-container');
            
            mapWrapper.style.transform = `scale(${currentScale})`;
            
            const baseW = currentDepo === 'am' ? 900 : 1100;
            const baseH = (baseW * 9) / 16; 
            
            mapContainer.style.width = (baseW * currentScale) + 'px';
            mapContainer.style.height = (baseH * currentScale) + 'px';
        }

        document.addEventListener("DOMContentLoaded", () => {
            if(window.haritaAmeliyathane) {
                switchDepo('am');
            } else {
                setTimeout(() => switchDepo('am'), 500);
            }
        });

        let unsub = null;
        function loadMappingData() {
            if(unsub) unsub();
            unsub = onSnapshot(collection(db, currentCollection), (snapshot) => {
                mappingData = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    mappingData.push({
                        id: doc.id,
                        urunKodu: data.urunKodu || "",
                        urunAdi: data.urunAdi || "",
                        barkod: data.barkod || "",
                        refNo: data.refNo || "",
                        adres: data.adres || "",
                        searchStr: `${data.urunKodu} ${data.urunAdi} ${data.barkod || ""} ${data.refNo || ""}`.toLowerCase()
                    });
                });
            });
        }

        window.showAlert = (desc) => {
            document.getElementById('alert-desc').innerText = desc;
            document.getElementById('custom-alert').style.display = 'flex';
        };
        window.closeAlert = () => document.getElementById('custom-alert').style.display = 'none';

        window.playBeep = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1000, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.1);
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'error') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start();
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.4);
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) {}
        };

        window.clearSearch = () => {
            inputEl.value = '';
            clearIcon.style.display = 'none';
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
            bannerEl.style.display = 'none';
            const svgEl = document.querySelector(`#map-area svg`);
            if (svgEl) svgEl.innerHTML = '';
            inputEl.focus();
        };

        // EN KUSURSUZ ÇALIŞAN SABİT (L-ŞEKLİNDE) LAZER ÇİZİM MANTIĞI
        window.drawPath = function(targetId) {
            const isAm = currentDepo === 'am';
            const map = document.getElementById('map-area');
            
            let targetIdRaw = targetId.trim();
            if (isAm && (targetIdRaw === "02.01.06" || targetIdRaw === "03.01.06")) {
                targetIdRaw = targetIdRaw.replace('.06', '.05');
            }
            
            const targetCell = document.getElementById(`cell-${targetIdRaw}`);
            const doorId = isAm ? 'door-am' : 'main-door';
            const door = document.getElementById(doorId);
            
            if(!targetCell || !door || !map) return;

            const isMobile = window.innerWidth <= 900;
            const strokeW = isMobile ? 3 : 4;
            const dashArr = isMobile ? "8, 8" : "12, 12";
            const offset = isMobile ? 8 : 15;

            const mapRect = map.getBoundingClientRect();
            const doorRect = door.getBoundingClientRect();
            const targetRect = targetCell.getBoundingClientRect();

            // Tüm koordinatları Scale etkisinden arındırıyoruz!
            const scale = currentScale;

            const dX = ((doorRect.left + doorRect.width / 2) - mapRect.left) / scale;
            let dY = 0;
            if(isAm) {
                dY = (doorRect.bottom - mapRect.top) / scale;
            } else {
                dY = ((doorRect.top + doorRect.height / 2) - mapRect.top) / scale;
            }

            const tX = ((targetRect.left + targetRect.width / 2) - mapRect.left) / scale;
            const tY = ((targetRect.top + targetRect.height / 2) - mapRect.top) / scale;

            let pathStr = "";

            if (isAm) {
                const shelf1 = document.querySelector('.map-shelf-1-am');
                const shelf2 = document.querySelector('.map-shelf-2-am');
                const s1Rect = shelf1.getBoundingClientRect();
                const s2Rect = shelf2.getBoundingClientRect();

                const cX = (((s1Rect.right + s2Rect.left) / 2) - mapRect.left) / scale;

                if (targetIdRaw === "05.01.01" || targetIdRaw === "04.01.01") {
                    const endX = ((targetRect.right - mapRect.left) / scale) + offset;
                    pathStr = `M ${dX} ${dY} L ${dX} ${tY} L ${endX} ${tY}`;
                } else {
                    const shelf1Top = (s1Rect.top - mapRect.top) / scale;
                    const safeY = dY + (shelf1Top - dY) / 2;
                    let endX = tX;
                    if (tX < cX) {
                        endX = ((targetRect.right - mapRect.left) / scale) + offset; 
                    } else {
                        endX = ((targetRect.left - mapRect.left) / scale) - offset;
                    }
                    pathStr = `M ${dX} ${dY} L ${dX} ${safeY} L ${cX} ${safeY} L ${cX} ${tY} L ${endX} ${tY}`;
                }
            } else {
                // ANA DEPO İÇİN KUSURSUZ GÜZERGAH
                // Dikey (Vertical) Koridorların X yüzdeleri
                const corridorsX = [
                    0.1817 * (mapRect.width / scale),
                    0.4000 * (mapRect.width / scale),
                    0.6975 * (mapRect.width / scale),
                    0.9408 * (mapRect.width / scale)
                ];
                
                let bestCx = corridorsX[0];
                let minDiff = Infinity;
                for(let cx of corridorsX) {
                    if (Math.abs(tX - cx) < minDiff) {
                        minDiff = Math.abs(tX - cx);
                        bestCx = cx;
                    }
                }
                
                let endX = tX;
                if (tX < bestCx) {
                    endX = ((targetRect.right - mapRect.left) / scale) + offset; 
                } else {
                    endX = ((targetRect.left - mapRect.left) / scale) - offset;
                }
                
                // Kapı Ana Depo'da sağda olduğu için, önce sola (koridora) sonra aşağı/yukarı sonra hedefe L-Şekli
                pathStr = `M ${dX} ${dY} L ${bestCx} ${dY} L ${bestCx} ${tY} L ${endX} ${tY}`;
            }

            const targetSvg = map.querySelector(`svg`);
            if(targetSvg) {
                targetSvg.innerHTML = `
                    <defs>
                        <marker id="arrowhead" markerWidth="${isMobile ? 6 : 8}" markerHeight="${isMobile ? 6 : 8}" refX="${isMobile ? 5 : 7}" refY="${isMobile ? 3 : 4}" orient="auto">
                            <polygon points="0 0, ${isMobile ? 6 : 8} ${isMobile ? 3 : 4}, 0 ${isMobile ? 6 : 8}" fill="#ff0000" />
                        </marker>
                    </defs>
                    <path d="${pathStr}" fill="none" stroke="#ff0000" stroke-width="${strokeW}" stroke-dasharray="${dashArr}" marker-end="url(#arrowhead)" class="path-animation" />
                `;
            }
        };

        const executeSearch = (val) => {
            clearTimeout(searchTimeout);
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
            bannerEl.style.display = 'none';
            const svgEl = document.querySelector(`#map-area svg`);
            if (svgEl) svgEl.innerHTML = '';
            
            if(val.length > 0) clearIcon.style.display = 'block';
            else clearIcon.style.display = 'none';

            if (val.length < 3) {
                dropdownEl.style.display = 'none';
                return;
            }

            searchTimeout = setTimeout(() => {
                const terms = val.split(/\s+/);
                const matches = mappingData.filter(m => terms.every(t => m.searchStr.includes(t))).slice(0, 15);

                if (matches.length > 0) {
                    dropdownEl.innerHTML = matches.map(m => {
                        const refText = m.refNo ? ` | REF: ${m.refNo}` : '';
                        return `
                            <div class="dropdown-item" onclick="selectProduct('${m.id}')">
                                <div class="di-name">${m.urunAdi}</div>
                                <div class="di-code">KOD: ${m.urunKodu}${refText}</div>
                            </div>
                        `;
                    }).join('');
                    dropdownEl.style.display = 'block';
                } else {
                    dropdownEl.innerHTML = '<div style="padding: 15px; color: #ff3333; text-align: center; font-size: 12px; font-weight:bold;">Sistemde haritalanmış eşleşme bulunamadı.</div>';
                    dropdownEl.style.display = 'block';
                }
            }, 250);
        };

        inputEl.addEventListener('input', (e) => executeSearch(e.target.value.toLowerCase().trim()));

        window.selectProduct = (id) => {
            const product = mappingData.find(m => m.id === id);
            dropdownEl.style.display = 'none';
            
            if (product) {
                inputEl.value = product.urunAdi;
                clearIcon.style.display = 'block';
                if (product.adres) {
                    const isAm = currentDepo === 'am';
                    let targetCellId = product.adres.trim();
                    if(isAm && (targetCellId === "02.01.06" || targetCellId === "03.01.06")) targetCellId = targetCellId.replace(".06", ".05");
                    
                    const map = document.getElementById('map-area');
                    const targetCell = map.querySelector(`[id="cell-${targetCellId}"]`);
                    if (targetCell) {
                        targetCell.classList.add('active');
                        nameEl.innerText = product.urunAdi;
                        addressEl.innerText = product.adres;
                        bannerEl.style.display = 'block';
                        
                        setTimeout(() => { 
                            drawPath(product.adres); 
                            document.getElementById('main-content-scroll').scrollTo({
                                top: document.getElementById('main-content-scroll').scrollHeight,
                                behavior: 'smooth'
                            });
                        }, 50);
                        
                        window.playBeep('success');
                    } else {
                        window.playBeep('error');
                        showAlert(`Ürün bulundu ancak tanımlı adres (${product.adres}) krokide mevcut değil.`);
                    }
                } else {
                    window.playBeep('error');
                    showAlert("Bu ürüne ait bir adres tanımlanmamış.");
                }
            }
        };

        document.addEventListener('click', (e) => {
            if (!document.querySelector('.search-input-box').contains(e.target) && !dropdownEl.contains(e.target)) {
                dropdownEl.style.display = 'none';
            }
        });

        window.openScanner = () => {
            document.getElementById('scanner-modal').style.display = 'flex';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    inputEl.value = decodedText;
                    closeScanner();
                    
                    const directMatch = mappingData.find(m => 
                        m.urunKodu === decodedText || 
                        m.barkod === decodedText || 
                        m.refNo === decodedText
                    );

                    if (directMatch) {
                        selectProduct(directMatch.id);
                    } else {
                        executeSearch(decodedText.toLowerCase().trim());
                    }
                },
                (errorMessage) => {}
            ).catch((err) => {
                showAlert("Kamera başlatılamadı. Lütfen tarayıcı izinlerini kontrol edin.");
                closeScanner();
            });
        };

        window.closeScanner = () => {
            document.getElementById('scanner-modal').style.display = 'none';
            if(html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
            }
        };

        window.addEventListener('resize', () => {
            const activeCell = document.querySelector('.cell.active');
            if (activeCell) {
                let id = activeCell.id.replace('cell-', '');
                drawPath(id);
            }
        });

    </script>
</body>
</html>
